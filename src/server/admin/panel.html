function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

function bindView() {
  document.querySelectorAll("[data-action]").forEach((el) => {
    el.onclick = async () => {
      const a = el.dataset.action;
      try {
        if (a === "pageSub") {
          setTab(el.dataset.tab || "overview");
          return;
        }
        if (a === "viewPlayer") {
          const ign = el.dataset.ign;
          state.selectedPlayer = ign;
          setTab("profiles");
          return;
        }
        if (a === "closeProfile") {
          state.selectedPlayer = null;
          render();
          return;
        }
        if (a === "searchProfiles") {
          state.profileQuery = document.getElementById("profileSearch")?.value?.trim() || "";
          state.selectedPlayer = null;
          render();
          return;
        }
        if (a === "clearProfileSearch") {
          state.profileQuery = "";
          state.selectedPlayer = null;
          render();
          return;
        }
        if (a === "openProfileIgn") {
          const ign = document.getElementById("profileOpenIgn")?.value?.trim();
          if (!ign) { toast("Enter an IGN", true); return; }
          state.selectedPlayer = ign;
          render();
          return;
        }
        if (a === "addProfileNote") {
          const text = document.getElementById("profileNote")?.value?.trim();
          if (!text) { toast("Enter a note", true); return; }
          await api(`/profiles/${encodeURIComponent(el.dataset.ign)}/notes`, { method: "POST", body: { text } });
          toast("Note added");
          render();
          return;
        }
        if (a === "delProfileNote") {
          await api(`/profiles/${encodeURIComponent(el.dataset.ign)}/notes/${encodeURIComponent(el.dataset.id)}`, { method: "DELETE" });
          toast("Note deleted");
          render();
          return;
        }
        if (a === "addProfileTag") {
          const tag = document.getElementById("profileTag")?.value?.trim();
          if (!tag) { toast("Enter a tag", true); return; }
          await api(`/profiles/${encodeURIComponent(el.dataset.ign)}/tags`, { method: "POST", body: { tag } });
          toast("Tag added");
          render();
          return;
        }
        if (a === "delProfileTag") {
          await api(`/profiles/${encodeURIComponent(el.dataset.ign)}/tags/${encodeURIComponent(el.dataset.tag)}`, { method: "DELETE" });
          toast("Tag removed");
          render();
          return;
        }
        if (a === "addProfileWarning") {
          const reason = document.getElementById("profileWarning")?.value?.trim();
          if (!reason) { toast("Enter a reason", true); return; }
          await api(`/profiles/${encodeURIComponent(el.dataset.ign)}/warnings`, { method: "POST", body: { reason } });
          toast("Warning added");
          render();
          return;
        }
        if (a === "profileTeleport") {
          const ign = el.dataset.ign;
          const toPlayer = document.getElementById("profileTpTo")?.value?.trim();
          const body = toPlayer
            ? { toPlayer }
            : {
                x: Number(document.getElementById("profileTpX")?.value),
                y: Number(document.getElementById("profileTpY")?.value),
                z: Number(document.getElementById("profileTpZ")?.value),
              };
          await api(`/players/${encodeURIComponent(ign)}/teleport`, { method: "POST", body });
          toast("Teleport sent");
          return;
        }
        if (a === "autoSub") {
          state.autoSub = el.dataset.sub || "messages";
          render();
          return;
        }
        if (a === "scanGroups") {
          const r = await api("/reports/scan", { method: "POST", body: {} });
          toast(r.hits?.length ? `${r.hits.length} oversized team(s)` : "No oversized teams");
          render();
          return;
        }
        if (a === "searchCombat") {
          state.reportQuery = document.getElementById("reportSearch")?.value?.trim() || "";
          render();
          return;
        }
        if (a === "refreshServerKits") {
          try {
            toast("Resyncing kit list…");
            const r = await api("/kits/resync", { method: "POST", body: {} });
            const where = r.host && r.port ? `${r.host}:${r.port}` : "RCON";
            if (!r.ok) {
              toast(r.error || "Resync failed", true);
            } else {
              toast(`Resynced ${r.count || 0} kit(s) from ${where}`);
            }
          } catch (e) {
            toast(e.message || "Resync failed", true);
          }
          render();
          return;
        }
        if (a === "viewServerKit" || a === "refreshServerKit") {
          const id = el.dataset.id;
          try {
            toast(`Loading kit info for ${id}…`);
            const r = await api(`/kits/server/${encodeURIComponent(id)}`);
            if (!r.ok) { toast(r.error || "Failed to load kit", true); return; }
            state.kitBuilderOpen = false;
            state.editingServerKit = id;
            state.editingServerKitData = r;
            toast(`${id}: ${(r.items || []).length} item(s)`);
          } catch (e) {
            toast(e.message || "Failed to load kit", true);
          }
          render();
          return;
        }
        if (a === "closeServerKit") {
          state.editingServerKit = null;
          state.editingServerKitData = null;
          render();
          return;
        }
        if (a === "openKitBuilder") {
          state.editingServerKit = null;
          state.editingServerKitData = null;
          state.kitDraft = { id: "", label: "", cooldownMinutes: 0, items: [], category: "All", query: "" };
          state.kitBuilderOpen = true;
          render();
          return;
        }
        if (a === "closeKitBuilder") {
          state.kitBuilderOpen = false;
          render();
          return;
        }
        if (a === "addServerKitItem") {
          const kit = el.dataset.kit;
          const item = document.getElementById("srvKitItem")?.value?.trim().toLowerCase();
          const amount = Number(document.getElementById("srvKitAmount")?.value) || 1;
          const condition = Number(document.getElementById("srvKitCond")?.value);
          const container = document.getElementById("srvKitSlot")?.value || "Main";
          if (!item) { toast("Enter item shortname", true); return; }
          try {
            const r = await api("/kits/server/item", {
              method: "POST",
              body: { kit, item, amount, condition: Number.isFinite(condition) ? condition : 1, container },
            });
            if (!r.ok) { toast(r.error || "Add failed", true); return; }
            state.editingServerKit = kit;
            state.editingServerKitData = r;
            toast(`Added ${item} to ${kit}`);
          } catch (e) {
            toast(e.message || "Add failed", true);
          }
          render();
          return;
        }
        if (a === "removeServerKitItem") {
          const kit = el.dataset.kit;
          const itemId = el.dataset.id;
          if (!confirm(`Remove item id ${itemId} from "${kit}"?`)) return;
          try {
            const r = await api("/kits/server/item/remove", { method: "POST", body: { kit, itemId } });
            if (!r.ok) { toast(r.error || "Remove failed", true); return; }
            state.editingServerKit = kit;
            state.editingServerKitData = r;
            toast("Item removed");
          } catch (e) {
            toast(e.message || "Remove failed", true);
          }
          render();
          return;
        }
        if (a === "delServerKit") {
          const id = el.dataset.id;
          if (!confirm(`Delete in-game kit "${id}" on the Rust server? (kit delete)`)) return;
          try {
            const r = await api("/kits/server/delete", { method: "POST", body: { id } });
            if (!r.ok) toast(r.error || "Delete failed", true);
            else {
              if (state.editingServerKit === id) {
                state.editingServerKit = null;
                state.editingServerKitData = null;
              }
              toast(`Deleted ${id} · now ${(r.kits || []).length} kit(s)`);
            }
          } catch (e) {
            toast(e.message || "Delete failed", true);
          }
          render();
          return;
        }
        if (a === "cmdGiveKit") {
          const ign = document.getElementById("cmdKitIgn")?.value?.trim();
          const sel = document.getElementById("cmdKitId");
          const id = sel?.value;
          const source = sel?.selectedOptions?.[0]?.dataset?.source || "auto";
          if (!ign || !id) { toast("Need kit + player IGN", true); return; }
          const r = await api(`/kits/${encodeURIComponent(id)}/give`, { method: "POST", body: { ign, source } });
          toast(r.ok ? (r.command ? `Ran ${r.command}` : `Gave ${r.given} item(s) to ${ign}`) : (r.error || "Failed"), !r.ok);
        }
        if (a === "giveKit" || a === "giveKitForm") {
          const id = a === "giveKit" ? el.dataset.id : document.getElementById("kitGiveId").value;
          const source = a === "giveKit" ? (el.dataset.source || "auto") : "auto";
          const ign = a === "giveKit"
            ? prompt("Online player IGN")
            : document.getElementById("kitGiveIgn").value;
          if (!ign || !id) { toast("Need kit id + IGN", true); return; }
          const r = await api(`/kits/${encodeURIComponent(id)}/give`, { method: "POST", body: { ign, source } });
          toast(r.ok ? (r.command ? `Ran ${r.command}` : `Gave ${r.given} item(s) to ${ign}`) : (r.error || "Partial fail"), !r.ok);
        }
        if (a === "saveChannels") {
          const channels = {};
          document.querySelectorAll("[data-channel-key]").forEach((sel) => {
            const key = sel.dataset.channelKey;
            const manual = document.querySelector(`[data-channel-manual="${key}"]`);
            const val = (manual?.value || sel.value || "").trim();
            channels[key] = val;
          });
          await api("/channels", { method: "POST", body: { channels } });
          toast("Channels saved");
          render();
        }
        if (a === "cmdRankGrant" || a === "cmdRankRevoke") {
          const ign = document.getElementById("cmdRankIgn")?.value?.trim();
          const rank = document.getElementById("cmdRank")?.value;
          if (!ign || !rank) { toast("Need player + rank", true); return; }
          const r = await api("/ranks", {
            method: "POST",
            body: { ign, rank, action: a === "cmdRankRevoke" ? "revoke" : "grant" },
          });
          toast(r.command ? `Ran ${r.command}` : (r.ok ? "Done" : r.error), !r.ok);
        }
        if (a === "runEvent") {
          const r = await api("/events/trigger", { method: "POST", body: { id: el.dataset.id } });
          toast(`Ran ${r.command}`);
        }
        if (a === "runCustomEvent") {
          const command = document.getElementById("cmdCustomEvent")?.value?.trim();
          if (!command) { toast("Enter a command", true); return; }
          const r = await api("/events/trigger", { method: "POST", body: { command } });
          toast(`Ran ${r.command}`);
        }
        if (a === "broadcast") {
          await api("/broadcast", { method: "POST", body: { message: document.getElementById("broadcastMsg").value } });
          toast("Broadcast sent");
        }
        if (a === "saveWipe") {
          const local = document.getElementById("wipeAtInput").value;
          if (!local) { toast("Pick a date/time", true); return; }
          const wipeAt = new Date(local).toISOString();
          await api("/wipe", { method: "POST", body: { wipeAt } });
          toast("Wipe time saved");
          await refreshOverview();
          render();
        }
        if (a === "clearWipe") {
          await api("/wipe", { method: "POST", body: { wipeAt: null } });
          toast("Wipe cleared");
          await refreshOverview();
          render();
        }
        if (a === "kitAddItem") {
          syncKitDraftFromForm();
          const id = el.dataset.id;
          const name = el.dataset.name || id;
          const existing = state.kitDraft.items.find((i) => i.item === id);
          if (existing) existing.amount += 1;
          else state.kitDraft.items.push({ item: id, amount: 1, name });
          refreshKitBuilderDom();
          return;
        }
        if (a === "kitAddCustom") {
          syncKitDraftFromForm();
          const raw = document.getElementById("kitCustomItem")?.value?.trim().toLowerCase();
          if (!raw || !/^[a-z0-9._-]+$/.test(raw)) { toast("Invalid shortname", true); return; }
          const existing = state.kitDraft.items.find((i) => i.item === raw);
          if (existing) existing.amount += 1;
          else state.kitDraft.items.push({ item: raw, amount: 1, name: raw });
          document.getElementById("kitCustomItem").value = "";
          refreshKitBuilderDom();
          return;
        }
        if (a === "kitRemoveItem") {
          syncKitDraftFromForm();
          state.kitDraft.items.splice(Number(el.dataset.idx), 1);
          refreshKitBuilderDom();
          return;
        }
        if (a === "kitCategory") {
          syncKitDraftFromForm();
          state.kitDraft.category = el.dataset.cat || "All";
          refreshKitBuilderDom();
          return;
        }
        if (a === "kitClearDraft") {
          state.kitDraft = { id: "", label: "", cooldownMinutes: 0, items: [], category: "All", query: "" };
          render();
          return;
        }
        if (a === "saveKit") {
          syncKitDraftFromForm();
          const items = state.kitDraft.items.map((i) => ({
            item: i.item,
            amount: Math.max(1, Number(i.amount) || 1),
          }));
          if (!items.length) { toast("Add at least one item", true); return; }
          await api("/kits", {
            method: "POST",
            body: {
              id: state.kitDraft.id || document.getElementById("kitId").value,
              label: state.kitDraft.label || document.getElementById("kitLabel").value,
              cooldownMinutes: state.kitDraft.cooldownMinutes,
              items,
            },
          });
          toast("Kit saved");
          state.kitDraft = { id: "", label: "", cooldownMinutes: 0, items: [], category: "All", query: "" };
          state.kitBuilderOpen = false;
          render();
        }
        if (a === "editKit") {
          const kits = await api("/kits?refresh=0");
          const kit = kits.kits.find((k) => k.id === el.dataset.id);
          if (!kit) return;
          const catalog = await ensureItemCatalog();
          const nameOf = (id) => catalog.items.find((i) => i.id === id)?.name || id;
          state.editingServerKit = null;
          state.editingServerKitData = null;
          state.kitDraft = {
            id: kit.id,
            label: kit.label || "",
            cooldownMinutes: kit.cooldownMinutes || 0,
            items: (kit.items || []).map((i) => ({
              item: i.item,
              amount: i.amount,
              name: nameOf(i.item),
            })),
            category: "All",
            query: "",
          };
          state.kitBuilderOpen = true;
          toast(`Editing ${kit.id}`);
          render();
        }
                if (a === "delKit") {
          if (!confirm(`Delete kit ${el.dataset.id}?`)) return;
          await api(`/kits/${encodeURIComponent(el.dataset.id)}`, { method: "DELETE" });
          toast("Kit deleted");
          render();
        }
        if (a === "kick") {
          const reason = prompt(`Kick reason for ${el.dataset.ign}:`, "Kicked by admin")?.trim();
          if (reason == null) return;
          await api(`/players/${encodeURIComponent(el.dataset.ign)}/kick`, {
            method: "POST",
            body: { reason: reason || "Kicked by admin" },
          });
          toast(`Kicked ${el.dataset.ign}`);
          refreshOverview().then(render);
        }
        if (a === "ban") {
          const reason = prompt(`Ban reason for ${el.dataset.ign}:`, "")?.trim();
          if (reason == null) return;
          if (!reason) { toast("Ban reason required", true); return; }
          if (!confirm(`Ban ${el.dataset.ign}?\nReason: ${reason}`)) return;
          await api(`/players/${encodeURIComponent(el.dataset.ign)}/ban`, {
            method: "POST",
            body: { reason },
          });
          toast(`Banned ${el.dataset.ign}`);
          refreshOverview().then(render);
        }
        if (a === "rcon" || a === "preset") {
          const cmd = a === "preset" ? el.dataset.cmd : document.getElementById("rconCmd").value;
          state.consoleLog.push({ type: "in", text: `> ${cmd}` });
          try {
            const r = await api("/rcon", { method: "POST", body: { command: cmd } });
            state.consoleLog.push({ type: "out", text: r.result || "(empty)" });
          } catch (e) {
            state.consoleLog.push({ type: "err", text: e.message });
          }
          render();
          document.getElementById("rconCmd")?.focus();
        }
        if (a === "pushStats") { await api("/stats/push", { method: "POST", body: {} }); toast("Leaderboard pushed"); }
        if (a === "statsCategory") {
          state.statsCategory = el.dataset.cat || "kills";
          render();
          return;
        }
        if (a === "refreshServerStatus") {
          await refreshOverview();
          toast("Server status refreshed");
          render();
          return;
        }
        if (a === "resetStats") {
          if (!confirm("Reset all tracked kill/death stats?")) return;
          await api("/stats/reset", { method: "POST", body: {} }); toast("Stats reset"); render();
        }
        if (a === "lookup") {
          const name = document.getElementById("lookupName").value;
          const r = await api(`/stats/${encodeURIComponent(name)}`);
          document.getElementById("lookupOut").textContent = JSON.stringify(r.player, null, 2);
        }
        if (a === "addWarp") {
          const body = {
            name: document.getElementById("warpName").value,
            fromPlayer: document.getElementById("warpFrom").value || undefined,
            x: document.getElementById("warpX").value || undefined,
            y: document.getElementById("warpY").value || undefined,
            z: document.getElementById("warpZ").value || undefined,
          };
          await api("/warps", { method: "POST", body }); toast("Warp saved"); render();
        }
        if (a === "delWarp") { await api(`/warps/${encodeURIComponent(el.dataset.name)}`, { method: "DELETE" }); toast("Warp deleted"); render(); }
        if (a === "forceTp") {
          const ign = document.getElementById("tpIgn").value;
          const body = {
            toPlayer: document.getElementById("tpTo").value || undefined,
            x: document.getElementById("tpX").value || undefined,
            y: document.getElementById("tpY").value || undefined,
            z: document.getElementById("tpZ").value || undefined,
          };
          await api(`/players/${encodeURIComponent(ign)}/teleport`, { method: "POST", body }); toast("Teleport sent");
        }
        if (a === "forceLink") {
          await api("/links", { method: "POST", body: { discordId: document.getElementById("linkDiscord").value, ign: document.getElementById("linkIgn").value } });
          toast("Linked"); render();
        }
        if (a === "unlink") { await api(`/links/${encodeURIComponent(el.dataset.id)}`, { method: "DELETE" }); toast("Unlinked"); render(); }
        if (a === "addMsg") {
          await api("/automessages", { method: "POST", body: { text: document.getElementById("msgText").value, intervalMinutes: Number(document.getElementById("msgMins").value) } });
          toast("Message added"); render();
        }
        if (a === "toggleMsg") { await api(`/automessages/${el.dataset.id}/toggle`, { method: "POST", body: { enabled: el.dataset.on === "1" } }); render(); }
        if (a === "delMsg") { await api(`/automessages/${el.dataset.id}`, { method: "DELETE" }); render(); }
        if (a === "addJob") {
          await api("/schedule", { method: "POST", body: {
            name: document.getElementById("jobName").value,
            command: document.getElementById("jobCmd").value,
            intervalMinutes: Number(document.getElementById("jobMins").value),
          }});
          toast("Job scheduled"); render();
        }
        if (a === "runJob") { const r = await api(`/schedule/${el.dataset.id}/run`, { method: "POST", body: {} }); toast(r.result || "Ran"); render(); }
        if (a === "toggleJob") { await api(`/schedule/${el.dataset.id}/toggle`, { method: "POST", body: { enabled: el.dataset.on === "1" } }); render(); }
        if (a === "delJob") { await api(`/schedule/${el.dataset.id}`, { method: "DELETE" }); render(); }
        if (a === "createKey") {
          const permissions = {};
          document.querySelectorAll("[data-perm-check]").forEach((box) => {
            permissions[box.dataset.permCheck] = box.checked;
          });
          const r = await api("/keys", {
            method: "POST",
            body: { label: document.getElementById("keyLabel").value, permissions },
          });
          state.lastCreatedKey = r;
          toast("Staff key created — copy it now");
          render();
        }
        if (a === "toggleKey") {
          await api(`/keys/${el.dataset.id}`, { method: "PATCH", body: { enabled: el.dataset.on === "1" } });
          toast(el.dataset.on === "1" ? "Key enabled" : "Key disabled");
          render();
        }
        if (a === "revokeKey") {
          if (!confirm("Permanently revoke this access key?")) return;
          await api(`/keys/${el.dataset.id}`, { method: "DELETE" });
          toast("Key revoked");
          render();
        }
        
        // Ban Management
        if (a === "syncBans") {
          const r = await api("/bans/sync", { method: "POST", body: {} });
          if (r.ok) {
            if (r.sync?.ok === false) {
              toast(r.sync.error || "Sync failed — check RCON");
            } else {
              const added = (r.sync?.added || 0) + (r.fromLogs?.added || 0);
              const parsed = r.sync?.parsed || 0;
              toast(
                added
                  ? `Synced ${added} new ban(s) (${parsed} on server)`
                  : parsed
                    ? `Server list matched (${parsed} bans)`
                    : "No bans found in server response",
              );
            }
            render();
          } else {
            toast(r.error || "Sync failed");
          }
          return;
        }
        if (a === "createBan") {
          const ign = document.getElementById("banIgn")?.value?.trim();
          const reason = document.getElementById("banReason")?.value?.trim();
          const duration = Number(document.getElementById("banDuration")?.value || 0);
          
          if (!ign) { toast("Player IGN required", true); return; }
          if (!reason) { toast("Ban reason required", true); return; }
          
          const r = await api("/bans", { method: "POST", body: { ign, reason, duration } });
          if (r.ok) {
            toast(`Banned ${ign}`);
            render();
          } else {
            toast(r.error, true);
          }
        }
        
        if (a === "unban") {
          const ign = el.dataset.ign;
          if (!confirm(`Unban ${ign}?`)) return;
          
          const r = await api(`/bans/${encodeURIComponent(ign)}`, { method: "DELETE", body: {} });
          if (r.ok) {
            toast(`Unbanned ${ign}`);
            render();
          } else {
            toast(r.error, true);
          }
        }
        
        // Scheduled Events
        if (a === "createEvent") {
          const name = document.getElementById("eventName")?.value?.trim();
          const command = document.getElementById("eventCommand")?.value?.trim();
          const type = document.getElementById("eventType")?.value;
          
          if (!name) { toast("Event name required", true); return; }
          if (!command) { toast("Command required", true); return; }
          
          let schedule = { type };
          
          if (type === "interval") {
            schedule.minutes = Number(document.getElementById("eventInterval")?.value || 60);
          } else if (type === "daily") {
            schedule.time = document.getElementById("eventTime")?.value || "04:00";
          } else if (type === "once") {
            schedule.at = document.getElementById("eventOnce")?.value;
            if (!schedule.at) { toast("Date/time required for one-time events", true); return; }
          }
          
          const r = await api("/events", { method: "POST", body: { name, command, schedule, oneTime: type === "once" } });
          if (r.ok) {
            toast("Event created");
            render();
          } else {
            toast(r.error, true);
          }
        }
        
        if (a === "runEvent") {
          const r = await api(`/events/${el.dataset.id}/run`, { method: "POST", body: {} });
          if (r.ok) {
            toast("Event executed");
          } else {
            toast(r.error, true);
          }
        }
        
        if (a === "toggleEvent") {
          const enabled = el.dataset.enabled === "1" ? false : true;
          const r = await api(`/events/${el.dataset.id}`, { method: "PATCH", body: { enabled } });
          if (r.ok) {
            toast(enabled ? "Event enabled" : "Event disabled");
            render();
          } else {
            toast(r.error, true);
          }
        }
        
        if (a === "delEvent") {
          if (!confirm("Delete this scheduled event?")) return;
          const r = await api(`/events/${el.dataset.id}`, { method: "DELETE" });
          if (r.ok) {
            toast("Event deleted");
            render();
          } else {
            toast(r.error, true);
          }
        }
      } catch (e) {
        toast(e.message, true);
      }
    };
  });

  // Event type selector
  const eventTypeSelector = document.getElementById("eventType");
  if (eventTypeSelector) {
    eventTypeSelector.onchange = () => {
      const type = eventTypeSelector.value;
      document.getElementById("intervalField")?.classList.toggle("hidden", type !== "interval");
      document.getElementById("timeField")?.classList.toggle("hidden", type !== "daily");
      document.getElementById("onceField")?.classList.toggle("hidden", type !== "once");
    };
  }

  document.querySelectorAll("[data-toggle-dropdown]").forEach((btn) => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const target = btn.dataset.toggleDropdown;
      const dropdown = btn.closest(".dropdown");
      const wasOpen = dropdown.classList.contains("open");
      
      document.querySelectorAll(".dropdown.open").forEach(d => d.classList.remove("open"));
      
      if (!wasOpen) {
        dropdown.classList.add("open");
      }
    };
  });

  document.addEventListener("click", () => {
    document.querySelectorAll(".dropdown.open").forEach(d => d.classList.remove("open"));
  });

  const rconInput = document.getElementById("rconCmd");
  if (rconInput) {
    rconInput.onkeydown = (e) => {
      if (e.key === "Enter") document.querySelector('[data-action="rcon"]')?.click();
    };
  }

  document.querySelectorAll("[data-channel-key]").forEach((sel) => {
    sel.onchange = () => {
      const input = document.querySelector(`[data-channel-manual="${sel.dataset.channelKey}"]`);
      if (input) input.value = sel.value;
    };
  });
  document.querySelectorAll("[data-channel-manual]").forEach((input) => {
    input.oninput = () => {
      const sel = document.querySelector(`[data-channel-key="${input.dataset.channelManual}"]`);
      if (!sel) return;
      const match = [...sel.options].find((o) => o.value === input.value.trim());
      sel.value = match ? match.value : "";
    };
  });
  document.querySelectorAll("[data-kit-modal]").forEach((modal) => {
    modal.onclick = (e) => e.stopPropagation();
  });
  bindKitBuilderEvents();
}

document.getElementById("loginBtn").onclick = async () => {
  try {
    await api("/login", { method: "POST", body: { password: document.getElementById("password").value } });
    const errorEl = document.getElementById("loginError");
    errorEl.textContent = "";
    errorEl.classList.add("hidden");
    await boot();
  } catch (e) {
    const errorEl = document.getElementById("loginError");
    errorEl.textContent = e.message || "Invalid password";
    errorEl.classList.remove("hidden");
  }
};
document.getElementById("password").onkeydown = (e) => {
  if (e.key === "Enter") document.getElementById("loginBtn").click();
};
document.getElementById("logoutBtn").onclick = async () => {
  await api("/logout", { method: "POST", body: {} });
  location.reload();
};
document.querySelectorAll(".nav [data-tab]").forEach((b) => {
  b.onclick = () => setTab(b.dataset.tab);
});
document.querySelectorAll(".nav [data-nav]").forEach((b) => {
  b.onclick = () => {
    const tab = defaultTabForSection(b.dataset.nav);
    if (tab) setTab(tab);
  };
});
document.getElementById("advancedToggle")?.addEventListener("click", () => {
  const root = document.getElementById("navAdvanced");
  setAdvancedOpen(!root?.classList.contains("open"));
});

document.getElementById("navToggle")?.addEventListener("click", () => setNavOpen(true));
document.getElementById("navClose")?.addEventListener("click", () => setNavOpen(false));
document.getElementById("navBackdrop")?.addEventListener("click", () => setNavOpen(false));
document.getElementById("logoutBtnMobile")?.addEventListener("click", () => document.getElementById("logoutBtn")?.click());
window.addEventListener("keydown", (e) => { if (e.key === "Escape") setNavOpen(false); });

// Mobile swipe gestures for sidebar
let touchStartX = 0;
let touchStartY = 0;
let touchEndX = 0;
let touchEndY = 0;

function handleSwipe() {
  const deltaX = touchEndX - touchStartX;
  const deltaY = Math.abs(touchEndY - touchStartY);
  
  if (Math.abs(deltaX) > 50 && deltaY < 70) {
    if (deltaX > 0 && touchStartX < 50) {
      setNavOpen(true);
    } else if (deltaX < 0 && state.navOpen) {
      setNavOpen(false);
    }
  }
}

document.addEventListener("touchstart", (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

document.addEventListener("touchend", (e) => {
  touchEndX = e.changedTouches[0].screenX;
  touchEndY = e.changedTouches[0].screenY;
  handleSwipe();
}, { passive: true });


boot().catch((e) => {
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginError").textContent = e.message;
  initLoginScene();
});
</script>
</body>
</html>
