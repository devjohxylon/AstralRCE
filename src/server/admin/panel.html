<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<meta name="theme-color" content="#050506" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Astral Control</title>
<link rel="icon" type="image/png" href="/logo.png" />
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #050506;
  --bg2: #0c0d10;
  --bg3: #12141a;
  --bg-elev: #181b22;
  --line: rgba(255,255,255,.07);
  --line2: rgba(255,255,255,.14);
  --text: #f0f2f5;
  --muted: #9aa0ab;
  --faint: #5e646f;
  --chrome: #d7dde6;
  --chrome-dim: #8a93a0;
  --accent: #e8edf4;
  --accent-dim: rgba(215,221,230,.22);
  --info: #7eb8e8;
  --ok: #5ed9a0;
  --bad: #ff6b73;
  --warn: #e8c06a;
  --radius: 4px;
  --radius-sm: 3px;
  --shadow: 0 24px 60px rgba(0,0,0,.55);
  --font: "Space Grotesk", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --hud: rgba(215,221,230,.55);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
body { touch-action: pan-y; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
body {
  background:
    radial-gradient(900px 420px at 12% -8%, rgba(215,221,230,.08), transparent 55%),
    radial-gradient(700px 380px at 100% 0%, rgba(255,255,255,.03), transparent 45%),
    linear-gradient(180deg, #07080a 0%, #050506 40%, #040405 100%);
  background-attachment: fixed;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .45;
  background-image:
    linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse at 50% 20%, #000 20%, transparent 75%);
}
#login, #app, .toast { position: relative; z-index: 1; }

button, input, select, textarea { font: inherit; }
button {
  cursor: pointer; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); color: #fff;
  padding: .65rem 1.1rem; border-radius: 6px; font-weight: 600; font-size: .82rem;
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  letter-spacing: .01em; transition: all .2s ease;
}
button:hover {
  border-color: rgba(255,255,255,.2); background: rgba(255,255,255,.08);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
}
button:active { transform: translateY(0); }
button.primary {
  background: linear-gradient(180deg, #f4f6f8, #c8d0da);
  border-color: #eef1f5; color: #0a0b0d; font-weight: 700;
  box-shadow: 0 8px 24px rgba(215,221,230,.12), inset 0 1px 0 rgba(255,255,255,.65);
}
button.primary:hover {
  background: linear-gradient(180deg, #fff, #d7dde6);
  border-color: #fff; color: #050506;
  box-shadow: 0 10px 28px rgba(215,221,230,.2);
}
button.danger { border-color: rgba(255,107,115,.35); color: #ffb0b5; background: #160c0e; }
button.danger:hover { background: #241014; border-color: rgba(255,107,115,.55); color: #fff; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover { background: rgba(255,255,255,.04); color: var(--text); box-shadow: none; }
input, select, textarea {
  width: 100%; background: rgba(0,0,0,.45); border: 1px solid var(--line); color: var(--text);
  padding: .6rem .75rem; border-radius: var(--radius-sm); font-family: var(--mono); font-size: .8rem;
}
input[type="checkbox"], input[type="radio"] {
  width: 16px; height: 16px; min-width: 16px; padding: 0; margin: 0;
  background: transparent; border: none; box-shadow: none; accent-color: #7eb8e8;
}
input::placeholder, textarea::placeholder { color: var(--faint); }
input:focus, textarea:focus, select:focus {
  outline: none; border-color: rgba(215,221,230,.4);
  box-shadow: 0 0 0 3px rgba(215,221,230,.08);
}
.hidden { display: none !important; }

/* ── Login: Clean HUD matching admin panel ── */
#login {
  position: relative; min-height: 100vh; min-height: 100svh;
  display: grid; place-items: center; padding: 2rem 1.25rem;
  background:
    radial-gradient(900px 420px at 12% -8%, rgba(215,221,230,.08), transparent 55%),
    radial-gradient(700px 380px at 100% 0%, rgba(255,255,255,.03), transparent 45%),
    linear-gradient(180deg, #07080a 0%, #050506 40%, #040405 100%);
  background-attachment: fixed;
}
#login::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .45;
  background-image:
    linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse at 50% 50%, #000 20%, transparent 75%);
}

.login-stage {
  position: relative; z-index: 1; width: min(440px, 100%);
  animation: loginFadeIn .5s ease both;
}
@keyframes loginFadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: none; }
}

.login-header {
  text-align: center; margin-bottom: 2rem;
}
.login-mark {
  display: inline-block; width: 64px; height: 64px; border-radius: 50%;
  object-fit: cover; background: #000; border: 1px solid rgba(215,221,230,.25);
  margin-bottom: 1rem; box-shadow: 0 8px 24px rgba(0,0,0,.3);
}
.login-title {
  margin: 0; font-size: 1.8rem; font-weight: 700; letter-spacing: -.02em;
  background: linear-gradient(180deg, #fff, #9aa3af);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.login-subtitle {
  margin: .5rem 0 0; font-family: var(--mono); font-size: .7rem;
  letter-spacing: .15em; text-transform: uppercase; color: var(--muted);
}
.login-dev-note {
  margin: 1rem 0 0; text-align: center;
  font-family: var(--mono); font-size: .65rem; line-height: 1.5;
  color: rgba(215,221,230,.45);
}
.login-dev-note b { color: rgba(232, 192, 106, .95); font-weight: 600; }

.login-card {
  position: relative; width: 100%;
  background:
    linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%),
    rgba(12,13,16,.88);
  border: 1px solid var(--line);
  padding: 1.75rem 1.5rem;
  backdrop-filter: blur(8px);
  box-shadow: 0 12px 40px rgba(0,0,0,.4);
  border-radius: var(--radius);
}
.login-card::before, .login-card::after {
  content: ""; position: absolute; width: 10px; height: 10px;
  border-color: var(--hud); border-style: solid; opacity: .7;
}
.login-card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
.login-card::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

.login-card label {
  display: block; font-family: var(--mono); font-size: .65rem;
  letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  margin-bottom: .5rem;
}
.login-card input {
  width: 100%; margin-bottom: 1.25rem;
  background: rgba(0,0,0,.55); border-color: rgba(255,255,255,.14);
  letter-spacing: .08em;
}
.login-card input:focus {
  outline: none; border-color: rgba(255,255,255,.4);
  box-shadow: 0 0 0 1px rgba(255,255,255,.15);
}
.login-card button.primary {
  width: 100%; margin-top: .5rem;
}
.login-error {
  margin: .75rem 0 0; padding: .75rem; background: rgba(255,107,115,.08);
  border: 1px solid rgba(255,107,115,.25); border-radius: var(--radius-sm);
  color: #ffb0b5; font-family: var(--mono); font-size: .72rem; text-align: center;
}

@media (max-width: 800px) {
  #login { padding: 1.5rem 1rem; }
  .login-stage { width: 100%; }
  .login-card { padding: 1.5rem 1.25rem; }
}

#app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; transition: grid-template-columns .2s ease; }
#app.sidebar-collapsed { grid-template-columns: 1fr; }
#app.sidebar-collapsed .nav { display: none; }
.desktop-nav-open {
  display: none;
  width: 36px; height: 36px; padding: 0;
  align-items: center; justify-content: center;
  flex: none; border-radius: 8px;
  background: rgba(255,255,255,.05);
}
#app.sidebar-collapsed .desktop-nav-open { display: inline-flex; }
.desktop-nav-open:hover { background: rgba(255,255,255,.1); }
.mobile-bar { display: none; }
.nav-backdrop {
  display: none; position: fixed; inset: 0; z-index: 40;
  background: rgba(0,0,0,.55); backdrop-filter: blur(2px);
}

/* ── Sidebar ── */
.nav {
  background:
    linear-gradient(180deg, rgba(215,221,230,.04), transparent 28%),
    linear-gradient(180deg, #090a0d, #060708);
  border-right: 1px solid var(--line);
  padding: .85rem .7rem 1rem;
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  box-shadow: inset -1px 0 0 rgba(215,221,230,.04);
  z-index: 50;
}
.brand {
  display: flex; align-items: center; gap: .7rem; position: relative;
  font-size: .95rem; font-weight: 700; letter-spacing: -.02em;
  padding: .85rem .65rem; margin-bottom: .3rem;
  border-bottom: 1px solid var(--line);
}
.brand .logo {
  width: 28px; height: 28px; border-radius: 50%; flex: none; object-fit: cover;
  background: #000; border: 1px solid rgba(215,221,230,.28);
}
.brand > span {
  background: linear-gradient(180deg, #fff, #9aa3af);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  font-weight: 600; letter-spacing: .08em; font-size: .65rem;
  flex: 1;
  min-width: 0;
  overflow: hidden;
}
.sidebar-toggle { 
  width: 26px; height: 26px; 
  padding: 0; display: none; align-items: center; justify-content: center;
  border-radius: 6px; background: rgba(255,255,255,.05);
  flex-shrink: 0;
  margin-left: auto;
  transition: all .15s ease;
}
.sidebar-toggle:hover {
  background: rgba(255,255,255,.1);
}
@media (min-width: 901px) { .sidebar-toggle { display: inline-flex; } }
.nav-group { margin-top: .7rem; }
.nav-group-label {
  font-family: var(--mono); font-size: .55rem; letter-spacing: .18em; text-transform: uppercase;
  color: var(--faint); padding: 0 .45rem .3rem;
}
.nav button {
  width: 100%; text-align: left; justify-content: flex-start; margin-bottom: .1rem;
  background: transparent; border-color: transparent; font-weight: 600; color: var(--muted);
  padding: .42rem .5rem; gap: .5rem; border-radius: var(--radius-sm);
  font-size: .82rem; min-height: 36px; white-space: nowrap; overflow: hidden;
}
.nav button .ico { width: 14px; height: 14px; flex: none; opacity: .7; }
.nav button:hover { color: var(--text); background: rgba(255,255,255,.035); box-shadow: none; }
.nav button.active {
  background: linear-gradient(90deg, rgba(215,221,230,.1), rgba(215,221,230,.02));
  color: #fff; border-color: transparent;
  box-shadow: inset 2px 0 0 var(--chrome);
}
.nav button.active .ico { opacity: 1; color: var(--chrome); }
.nav-close {
  display: none; margin-left: auto; width: 36px; height: 36px; padding: 0;
  align-items: center; justify-content: center;
}
.nav-spacer { flex: 1; min-height: .5rem; }
.nav-user {
  display: flex; align-items: center; gap: .55rem; padding: .5rem .55rem;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: rgba(0,0,0,.35); margin-top: .55rem;
}
.nav-user .avatar {
  width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: #111; color: var(--chrome); font-weight: 700; font-size: .72rem;
  border: 1px solid rgba(215,221,230,.25);
}
.nav-user .who { min-width: 0; }
.nav-user .who b { display: block; font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-user .who small { color: var(--faint); font-family: var(--mono); font-size: .58rem; letter-spacing: .1em; }
.nav-foot { display: none; }
.dev-banner {
  margin-top: .65rem;
  padding: .65rem .7rem;
  border: 1px solid rgba(232, 192, 106, .22);
  border-radius: var(--radius);
  background: rgba(232, 192, 106, .06);
  color: rgba(232, 192, 106, .92);
  font-family: var(--mono);
  font-size: .62rem;
  line-height: 1.45;
  letter-spacing: .02em;
}
.dev-banner strong {
  display: block;
  font-size: .58rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  margin-bottom: .25rem;
  color: var(--warn);
}
.dev-banner span { color: rgba(215,221,230,.55); }
.dev-banner b { color: #f0f2f5; font-weight: 600; }

/* ── Main ── */
.main { padding: 2.5rem 3rem 4rem; max-width: 1500px; min-width: 0; }
#view {
  animation: viewIn .22s ease both;
  margin-top: .25rem;
}

/* ── Fullscreen GTA-style live map ── */
body.map-mode #app {
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}
body.map-mode .main {
  padding: 0;
  max-width: none;
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
body.map-mode .topbar {
  margin: 0;
  padding: .55rem 1rem .55rem 1.1rem;
  border-bottom: 1px solid rgba(255,255,255,.06);
  flex-shrink: 0;
  background: rgba(5,5,6,.92);
  backdrop-filter: blur(10px);
  z-index: 5;
}
body.map-mode .topbar h2 { font-size: 1.05rem; letter-spacing: -.02em; }
body.map-mode .page-sub { display: none; }
body.map-mode .topbar::after { display: none; }
body.map-mode .subtabs.page-subtabs { display: none; }
body.map-mode #view {
  flex: 1;
  min-height: 0;
  margin: 0;
  overflow: hidden;
  animation: none;
}
.map-fs {
  position: relative;
  width: 100%;
  height: 100%;
  background: #050506;
  overflow: hidden;
}
.map-fs .map-stage {
  position: absolute;
  inset: 0;
  background: #050506;
  overflow: hidden;
  cursor: default;
}
.map-fs .map-stage.map-calibrating { cursor: crosshair; }
.map-hud {
  position: absolute;
  z-index: 4;
  pointer-events: none;
}
.map-hud > * { pointer-events: auto; }
.map-hud-top {
  top: .75rem;
  left: .75rem;
  right: .75rem;
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  align-items: center;
  justify-content: space-between;
}
.map-hud-panel {
  background: rgba(8, 10, 14, .82);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 8px;
  backdrop-filter: blur(14px);
  box-shadow: 0 12px 40px rgba(0,0,0,.45);
}
.map-hud-top .map-hud-meta {
  font-family: var(--mono);
  font-size: .68rem;
  color: rgba(215,221,230,.75);
  padding: .45rem .7rem;
  letter-spacing: .02em;
}
.map-hud-top .map-hud-actions {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  align-items: center;
  padding: .35rem;
}
.map-hud-top .map-hud-actions label,
.map-hud-top .map-hud-actions button {
  padding: .4rem .65rem;
  font-size: .7rem;
  margin: 0;
}
.map-hud-right {
  top: 3.6rem;
  right: .75rem;
  bottom: .75rem;
  width: min(300px, 42vw);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.map-hud-right .map-hud-panel {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: .75rem;
}
.map-hud-right h3 {
  margin: 0 0 .35rem;
  font-size: .78rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: #fff;
}
.map-hud-right .card-desc {
  margin: 0 0 .65rem;
  font-size: .68rem;
}
.map-player-list {
  flex: 1;
  min-height: 0;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: .35rem;
  padding-right: .15rem;
}
.map-player-chip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
  width: 100%;
  text-align: left;
  padding: .45rem .55rem;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,.06);
  background: rgba(255,255,255,.03);
  color: #fff;
  font-size: .78rem;
  transform: none;
  box-shadow: none;
}
.map-player-chip:hover {
  transform: none;
  background: rgba(255,255,255,.07);
  border-color: rgba(255,255,255,.14);
  box-shadow: none;
}
.map-player-chip .name { font-weight: 600; }
.map-player-chip .pos {
  font-family: var(--mono);
  font-size: .62rem;
  color: var(--muted);
  white-space: nowrap;
}
.map-hud-bottom {
  left: .75rem;
  bottom: .75rem;
  width: min(420px, calc(100% - 1.5rem - min(300px, 42vw) - .75rem));
  max-height: min(42vh, 360px);
  overflow: auto;
}
.map-hud-bottom .map-hud-panel {
  padding: .75rem;
  display: grid;
  gap: .55rem;
}
.map-hud-bottom strong { font-size: .8rem; }
.map-hud-bottom .hint { font-size: .7rem; }
.map-hud-bottom select { width: auto; min-width: 140px; margin: 0; }
@media (max-width: 900px) {
  body.map-mode .topbar { padding: .45rem .7rem; }
  .map-hud-right {
    top: auto;
    right: .55rem;
    left: .55rem;
    bottom: .55rem;
    width: auto;
    max-height: 32vh;
  }
  .map-hud-bottom {
    left: .55rem;
    right: .55rem;
    bottom: calc(32vh + 1rem);
    width: auto;
    max-height: 28vh;
  }
  .map-hud-top { left: .55rem; right: .55rem; top: .55rem; }
}
@keyframes viewIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
.pill { transition: all .15s ease; }
.pill:hover { transform: translateY(-1px); box-shadow: 0 2px 8px currentColor; }
.table tbody tr { transition: all .12s ease; }
button { transition: all .15s ease; }
.card { transition: all .2s ease; }
.dropdown-menu { transition: opacity .15s ease, transform .15s ease; }

.topbar {
  display: flex; flex-wrap: wrap; gap: 1.5rem 2rem; align-items: flex-end; justify-content: space-between;
  margin-bottom: 2.75rem; padding-bottom: 1.75rem;
  border-bottom: 1px solid rgba(255,255,255,.06);
  position: relative;
}
.topbar::after { display: none; }
.title-wrap { min-width: 0; }
.topbar h2 {
  margin: 0; font-size: clamp(1.6rem, 2.5vw, 1.85rem); letter-spacing: -.04em; font-weight: 700;
  color: #fff;
}
.page-sub {
  margin: .55rem 0 0; color: rgba(215,221,230,.5); font-size: .78rem;
  font-family: var(--mono); letter-spacing: .02em; font-weight: 500;
  line-height: 1.45;
}
.pills { display: flex; gap: .6rem; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; gap: .4rem;
  font-family: var(--mono); font-size: .65rem; letter-spacing: .08em; padding: .4rem .75rem;
  border-radius: 6px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03);
  color: rgba(215,221,230,.7); font-weight: 600; text-transform: uppercase;
  transition: all .2s ease;
}
.pill::before { 
  content: ""; width: 6px; height: 6px; border-radius: 50%; 
  background: currentColor; opacity: .6;
}
.pill.plain::before { display: none; }
.pill:hover { 
  border-color: rgba(255,255,255,.15);
  background: rgba(255,255,255,.06);
  transform: none;
  box-shadow: none;
}
.pill.ok { color: #4ade80; border-color: rgba(74,222,128,.2); background: rgba(74,222,128,.08); }
.pill.ok::before { background: #4ade80; opacity: 1; }
.pill.bad { color: #f87171; border-color: rgba(248,113,113,.2); background: rgba(248,113,113,.08); }
.pill.bad::before { background: #f87171; opacity: 1; }
.pill.warn { color: #fbbf24; border-color: rgba(251,191,36,.2); background: rgba(251,191,36,.08); }
.pill.warn::before { background: #fbbf24; opacity: 1; }
.pill.info { color: #60a5fa; border-color: rgba(96,165,250,.2); background: rgba(96,165,250,.08); }
.pill.info::before { background: #60a5fa; opacity: 1; }

.health-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: .65rem;
  margin-bottom: 1rem;
}
.health-card {
  padding: .7rem .8rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: rgba(0,0,0,.22);
  min-width: 0;
}
.health-card .h-label {
  font-size: .65rem; font-family: var(--mono); letter-spacing: .04em;
  text-transform: uppercase; color: rgba(215,221,230,.45); margin-bottom: .25rem;
}
.health-card .h-value {
  font-size: .88rem; font-weight: 650; line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.health-card .h-detail {
  margin-top: .2rem; font-size: .68rem; font-family: var(--mono);
  color: rgba(215,221,230,.45);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.health-card.ok { border-color: rgba(74,222,128,.22); }
.health-card.ok .h-value { color: #4ade80; }
.health-card.bad { border-color: rgba(248,113,113,.25); }
.health-card.bad .h-value { color: #f87171; }
.health-card.warn { border-color: rgba(251,191,36,.22); }
.health-card.warn .h-value { color: #fbbf24; }
.quick-actions {
  display: flex; flex-wrap: wrap; gap: .5rem;
  margin: 0 0 1rem;
}
.player-hub-search {
  display: grid; gap: .55rem;
  grid-template-columns: 1fr auto auto;
  margin-bottom: .85rem; align-items: stretch;
}

/* ── Cards & grids ── */
.grid { display: grid; gap: 1.75rem; }
.grid.stats { 
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
  gap: 2rem;
}

@media (max-width: 900px) {
  .grid { gap: 1rem; }
  .grid.stats { grid-template-columns: 1fr 1fr; gap: 1rem; }
}
.card {
  background: rgba(18, 20, 24, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 8px;
  padding: 2.25rem 2.5rem;
  position: relative;
  backdrop-filter: blur(12px);
  box-shadow: 0 1px 3px rgba(0,0,0,.12);
  transition: all .2s ease;
  margin-bottom: 2rem;
}
.card:last-child { margin-bottom: 0; }
.card:hover {
  border-color: rgba(255,255,255,.1);
  box-shadow: 0 4px 12px rgba(0,0,0,.18);
  transform: translateY(-2px);
}
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1.25rem; margin-bottom: 1.5rem; }
.card-head h3 { margin: 0; }
.card-head .actions { margin: 0; }
.card h3 {
  margin: 0 0 1.5rem; font-size: .72rem; letter-spacing: .15em; text-transform: uppercase;
  color: rgba(215,221,230,.5); font-weight: 600; font-family: var(--mono);
}
.card-desc { margin: -.3rem 0 1.25rem; color: var(--faint); font-size: .78rem; line-height: 1.6; }
.wipe-list {
  display: flex;
  flex-direction: column;
  margin: 0 0 1.1rem;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 10px;
  overflow: hidden;
  background: rgba(0,0,0,.25);
}
.wipe-row {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  column-gap: .8rem;
  align-items: center;
  margin: 0;
  padding: .72rem .95rem;
  border-bottom: 1px solid rgba(255,255,255,.06);
  cursor: pointer;
}
.wipe-row:last-of-type { border-bottom: 0; }
.wipe-row:hover { background: rgba(255,255,255,.03); }
/* Global `input { width:100% }` blows up checkboxes — pin these hard. */
.wipe-row input[type="checkbox"],
.wipe-auto input[type="checkbox"] {
  width: 16px !important;
  height: 16px !important;
  min-width: 16px !important;
  max-width: 16px !important;
  margin: 0 !important;
  padding: 0 !important;
  accent-color: #7eb8e8;
  cursor: pointer;
  box-shadow: none !important;
  border: none !important;
  background: transparent !important;
  appearance: auto;
}
.wipe-copy { min-width: 0; }
.wipe-copy b {
  display: block;
  font-size: .86rem;
  font-weight: 600;
  color: #eef1f5;
  line-height: 1.25;
}
.wipe-copy span {
  display: block;
  margin-top: .12rem;
  font-family: var(--mono);
  font-size: .66rem;
  color: var(--faint);
  line-height: 1.35;
}
.wipe-actions {
  display: flex;
  flex-wrap: wrap;
  gap: .6rem;
  align-items: center;
}
.wipe-actions input[type="text"] {
  flex: 1 1 160px;
  min-width: 140px;
  width: auto !important;
}
.wipe-auto {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  column-gap: .8rem;
  align-items: center;
  margin: .85rem 0 0;
  cursor: pointer;
}
.wipe-last {
  margin-top: 1rem;
  padding-top: .85rem;
  border-top: 1px solid rgba(255,255,255,.06);
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  align-items: center;
}

.card.stat {
  padding: 2rem 2.25rem; 
  height: 140px;
  min-height: 140px;
  max-height: 140px;
  display: flex; 
  flex-direction: column; 
  justify-content: space-between;
  background: rgba(18, 20, 24, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.08);
  overflow: hidden;
}
.card.stat:hover {
  border-color: rgba(215,221,230,.15);
  background: rgba(22, 24, 28, 0.85);
}
.card.stat .metric,
.metric {
  font-family: var(--mono); font-size: clamp(1.85rem, 3vw, 2.25rem); font-weight: 700;
  line-height: 1; letter-spacing: -.04em;
  color: #fff;
}
.metric .slash {
  color: var(--faint); font-size: .55em; font-weight: 500; letter-spacing: 0;
}
.metric small {
  display: block; color: rgba(215,221,230,.45); font-size: .62rem; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; margin-top: .75rem;
  font-family: var(--mono);
}

/* ── Tables ── */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0; }
.log-detail {
  max-width: min(420px, 36vw);
  white-space: normal;
  word-break: break-word;
  line-height: 1.45;
  font-size: .68rem;
}
.log-chips { display: flex; flex-wrap: wrap; gap: .3rem; }
.log-chip {
  display: inline-block;
  padding: .12rem .4rem;
  border-radius: 3px;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.03);
  color: var(--chrome-dim);
  font-family: var(--mono);
  font-size: .62rem;
}
.log-kv { display: inline-block; margin: 0 .55rem .2rem 0; }
.log-kv .log-k { color: var(--faint); margin-right: .25rem; }
.log-source {
  font-family: var(--mono); font-size: .58rem; text-transform: uppercase;
  letter-spacing: .04em; color: var(--faint);
  border: 1px solid rgba(255,255,255,.08); padding: .1rem .35rem; border-radius: 999px;
}
.log-source.panel { color: var(--chrome-dim); }
.log-source.system { color: var(--info); }
.table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: .8rem; border-spacing: 0; }
.table thead th {
  position: sticky; top: 0; color: rgba(215,221,230,.5); font-weight: 600; text-transform: uppercase;
  font-size: .64rem; letter-spacing: .1em; padding: 1rem .75rem; border-bottom: 1px solid rgba(255,255,255,.06);
  text-align: left; background: transparent;
}
.table td { 
  text-align: left; padding: 1rem .75rem; 
  border-bottom: 1px solid rgba(255,255,255,.03); 
  vertical-align: middle; 
  color: rgba(215,221,230,.85);
}
.table tbody tr { transition: all .15s ease; }
.table tbody tr:hover { background: rgba(255,255,255,.02); }
.table tbody tr:last-child td { border-bottom: none; }
.table th:first-child, .table td:first-child { padding-left: .25rem; }
.table code {
  background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.08); padding: .2rem .5rem;
  border-radius: 4px; font-size: .72rem; color: #60a5fa;
}
.actions { display: flex; gap: .5rem; flex-wrap: wrap; }
.actions button { padding: .4rem .7rem; font-size: .74rem; }

/* ── Console ── */
.console {
  background: #030304; border: 1px solid var(--line); border-radius: var(--radius);
  min-height: 300px; max-height: 460px;
  padding: 1rem; font-family: var(--mono); font-size: .78rem; line-height: 1.55;
  overflow: auto; white-space: pre-wrap;
  box-shadow: inset 0 0 40px rgba(0,0,0,.5);
}
.console .in { color: var(--chrome); }
.console .out { color: #a8aeb8; }
.console .err { color: #ff8a93; }

/* ── Forms ── */
.form-row { display: grid; gap: .7rem; grid-template-columns: 1fr auto; margin-top: .9rem; align-items: start; }
.chan-grid { display: grid; gap: .8rem; }
.chan-row {
  display: grid; gap: .6rem .85rem;
  grid-template-columns: minmax(150px, 200px) 1fr minmax(170px, 1.3fr);
  align-items: center; padding: .7rem 0; border-bottom: 1px solid var(--line);
}
.chan-row:last-child { border-bottom: none; }
.chan-row label { font-size: .82rem; font-weight: 600; }
.chan-row label small { display: block; color: var(--faint); font-weight: 400; font-family: var(--mono); font-size: .64rem; margin-top: .2rem; }
.chan-row select, .chan-row input { margin: 0; }
.feed-settings-grid { display: grid; gap: .75rem; }
.feed-setting-card h3 { margin-bottom: .2rem; }
.feed-setting-card .muted { margin: 0 0 .75rem; }
.feed-field-grid {
  display: grid; gap: .65rem .9rem;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
}
.feed-field {
  display: flex; flex-direction: column; gap: .35rem;
  padding: .55rem .65rem;
  border: 1px solid rgba(255,255,255,.06);
  background: rgba(0,0,0,.22);
  border-radius: 6px;
}
.feed-field label {
  font-size: .78rem; font-weight: 600;
  display: flex; align-items: center; gap: .55rem;
}
.feed-field label small {
  display: block; width: 100%;
  color: var(--faint); font-weight: 400;
  font-family: var(--mono); font-size: .62rem; margin-top: .15rem;
}
.feed-field.toggle label { cursor: pointer; }
.feed-field input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
.feed-field select, .feed-field input[type="text"] { margin: 0; width: 100%; }
.feed-field input[type="number"] { margin: 0; width: 100%; }
.discord-actions {
  display: flex; flex-wrap: wrap; gap: .55rem; align-items: center;
  position: sticky; bottom: .75rem; z-index: 5;
  margin-top: 1rem; padding: .75rem .85rem;
  background: rgba(10,11,14,.92);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 -8px 24px rgba(0,0,0,.35);
}
.discord-actions .hint { margin: 0; flex: 1; min-width: 140px; }
.discord-shell { display: grid; gap: 1rem; }
.discord-intro {
  margin: 0;
  font-family: var(--mono);
  font-size: .72rem;
  color: rgba(215,221,230,.5);
  line-height: 1.55;
}
.chan-source {
  display: inline-block;
  margin-left: .35rem;
  padding: .05rem .35rem;
  border-radius: 4px;
  font-size: .6rem;
  font-weight: 600;
  letter-spacing: .02em;
  vertical-align: middle;
}
.chan-source.panel { background: rgba(90,180,120,.15); color: #8fd9a8; }
.chan-source.env { background: rgba(120,150,200,.15); color: #a8c0e0; }
.chan-source.unset { background: rgba(255,255,255,.06); color: rgba(215,221,230,.45); }
.cmd-catalog { display: grid; gap: .75rem; }
.cmd-group-card h3 { margin-bottom: .35rem; }
.cmd-row {
  display: grid; gap: .65rem;
  padding: .75rem 0;
  border-bottom: 1px solid var(--line);
}
.cmd-row:last-child { border-bottom: none; }
.cmd-row-head {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: .45rem .7rem;
}
.cmd-row-head code {
  font-size: .85rem; color: var(--chrome);
  background: rgba(255,255,255,.04); padding: .15rem .4rem; border-radius: 4px;
}
.cmd-row-head .cmd-desc {
  font-family: var(--mono); font-size: .68rem; color: var(--faint); flex: 1; min-width: 160px;
}
.cmd-access {
  font-family: var(--mono); font-size: .58rem; text-transform: uppercase; letter-spacing: .04em;
  color: rgba(215,221,230,.45); border: 1px solid rgba(255,255,255,.08);
  padding: .12rem .4rem; border-radius: 999px;
}
.cmd-access.staff { color: #fbbf24; border-color: rgba(251,191,36,.25); }
.cmd-access.admin { color: #f87171; border-color: rgba(248,113,113,.25); }
.cmd-access.public { color: #4ade80; border-color: rgba(74,222,128,.2); }
.cmd-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.actions-shell { display: grid; gap: 1rem; max-width: 1100px; }
.actions-player-bar {
  display: flex; flex-wrap: wrap; gap: .65rem .85rem;
  align-items: center;
  padding: .85rem 1rem;
}
.actions-player-bar .pill { flex: none; }
.actions-player-bar label {
  flex: none; font-size: .72rem; font-family: var(--mono);
  color: var(--muted); letter-spacing: .03em; text-transform: uppercase;
}
.actions-player-bar input {
  flex: 1; min-width: 180px; margin: 0; max-width: 320px;
}
.actions-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  align-items: stretch;
}
.actions-grid > .card {
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: .55rem;
}
.actions-grid .card-desc,
.actions-grid .hint { margin: 0; }
.actions-grid label.field-label {
  display: block; font-size: .7rem; color: var(--muted);
  font-family: var(--mono); margin: .15rem 0 0;
}
.actions-grid select, .actions-grid input { margin: 0; width: 100%; }
.actions-grid .primary,
.actions-grid .cmd-actions { margin-top: auto; padding-top: .35rem; }
.actions-events .event-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: .45rem;
}
.actions-events .event-grid button {
  width: 100%; justify-content: center; min-height: 40px;
}
.actions-events .form-row { margin-top: .75rem; }
.kit-builder { display: grid; gap: 1.5rem; }
.kit-picked {
  display: flex; flex-direction: column; gap: .5rem;
  max-height: 320px; overflow: auto; padding: .5rem;
  border: 1px solid rgba(255,255,255,.08); background: rgba(0,0,0,.3);
  border-radius: 6px;
}
.kit-picked-row {
  display: flex; gap: .75rem; align-items: center;
  padding: .65rem .75rem; border-radius: 6px;
  background: rgba(255,255,255,.02);
  border: 1px solid rgba(255,255,255,.04);
  transition: all .15s ease;
}
.kit-picked-row:hover {
  background: rgba(255,255,255,.04);
  border-color: rgba(255,255,255,.08);
}
.kit-picked-row strong { font-size: .8rem; display: block; }
.kit-picked-row code { font-size: .65rem; color: rgba(215,221,230,.5); }
.kit-picked-row input[type="number"] { 
  margin: 0; padding: .4rem .5rem; width: 70px; text-align: center;
  border-radius: 4px;
}
.kit-search-row { display: grid; grid-template-columns: 1fr auto; gap: .6rem; }
.kit-cats { display: flex; flex-wrap: wrap; gap: .4rem; }
.kit-cats button {
  padding: .35rem .7rem; font-size: .65rem; letter-spacing: .08em; text-transform: uppercase;
  border-radius: 6px;
}
.kit-cats button.active {
  color: #fff; background: rgba(96,165,250,.2); border-color: rgba(96,165,250,.4);
}
.kit-catalog {
  max-height: 400px; overflow: auto; border: 1px solid rgba(255,255,255,.08);
  background: rgba(0,0,0,.3); border-radius: 6px;
}
.kit-modal-backdrop {
  position: fixed; inset: 0; z-index: 9000;
  background: rgba(0,0,0,.7);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  padding: 1.25rem;
  animation: fadeIn .18s ease;
}
.kit-modal {
  position: relative;
  width: min(780px, 100%);
  max-height: min(88vh, 900px);
  overflow: auto;
  border-radius: var(--radius);
  padding: 1.5rem 1.5rem 1.35rem;
  background:
    linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%),
    rgba(12,13,16,.94);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  backdrop-filter: blur(10px);
}
.kit-modal::before, .kit-modal::after {
  content: ""; position: absolute; width: 12px; height: 12px;
  border-color: var(--hud); border-style: solid; opacity: .75; pointer-events: none;
}
.kit-modal::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
.kit-modal::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
.kit-modal-head {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
  margin-bottom: 1.15rem; padding-bottom: 1rem;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.kit-modal-eyebrow {
  margin: 0 0 .4rem;
  font-family: var(--mono); font-size: .62rem; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: rgba(215,221,230,.45);
}
.kit-modal-head h3 {
  margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em;
  background: linear-gradient(180deg, #fff, #9aa3af);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.kit-modal-head .actions { flex-wrap: wrap; justify-content: flex-end; }
.kit-modal-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(124px, 1fr));
  gap: .65rem;
}
.kit-tile {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: .4rem;
  padding: .85rem .55rem .7rem;
  border-radius: var(--radius-sm);
  background: rgba(0,0,0,.35);
  border: 1px solid rgba(255,255,255,.06);
  text-align: center;
  min-height: 142px;
  transition: border-color .15s ease, background .15s ease;
}
.kit-tile:hover {
  border-color: rgba(215,221,230,.18);
  background: rgba(255,255,255,.03);
}
.kit-tile img {
  width: 52px; height: 52px; object-fit: contain;
  border-radius: var(--radius-sm);
  background: rgba(0,0,0,.55);
  border: 1px solid rgba(255,255,255,.06);
  padding: 5px;
}
.kit-tile strong {
  font-size: .76rem; line-height: 1.25; font-weight: 600; color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.kit-tile .meta {
  font-family: var(--mono); font-size: .58rem; letter-spacing: .02em; color: var(--faint);
}
.kit-tile .qty {
  position: absolute; top: .4rem; right: .4rem;
  font-family: var(--mono); font-size: .62rem; font-weight: 600;
  letter-spacing: .04em;
  padding: .18rem .4rem; border-radius: var(--radius-sm);
  color: var(--chrome);
  background: rgba(215,221,230,.08);
  border: 1px solid rgba(215,221,230,.16);
}
.kit-tile .rm {
  position: absolute; top: .35rem; left: .35rem;
  padding: .12rem .38rem; font-size: .68rem; line-height: 1;
  border-radius: var(--radius-sm);
}
.kit-modal-add {
  margin-top: 1.15rem; padding-top: 1rem;
  border-top: 1px solid rgba(255,255,255,.06);
}
.kit-modal-add-label {
  margin: 0 0 .65rem;
  font-family: var(--mono); font-size: .62rem; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; color: rgba(215,221,230,.45);
}
.kit-modal.kit-builder-modal {
  width: min(980px, 100%);
}
.kit-builder-modal .kit-builder {
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 1.15rem;
  align-items: start;
}
.kit-builder-modal .kit-picked { max-height: 280px; }
.kit-builder-modal .kit-catalog { max-height: 360px; }
@media (max-width: 900px) {
  .kit-builder-modal .kit-builder { grid-template-columns: 1fr; }
}
.kit-item {
  display: flex; gap: .75rem; align-items: center;
  width: 100%; text-align: left; padding: .7rem .85rem; margin: 0;
  border: none; border-bottom: 1px solid rgba(255,255,255,.04); border-radius: 0;
  background: transparent; color: var(--text); cursor: pointer;
  font-family: var(--sans); box-shadow: none;
  transition: all .15s ease;
}
.kit-item:first-child { border-radius: 6px 6px 0 0; }
.kit-item:last-child { border-radius: 0 0 6px 6px; border-bottom: none; }
.kit-item:hover { 
  background: rgba(96,165,250,.08); 
  color: var(--text); 
  box-shadow: none;
}
.kit-item .meta { 
  font-family: var(--mono); font-size: .65rem; color: rgba(215,221,230,.4);
  margin-top: .15rem;
}
.kit-item .add { 
  font-family: var(--mono); font-size: .85rem; font-weight: 700; 
  color: #60a5fa; width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: rgba(96,165,250,.1);
  flex-shrink: 0;
}
@media (max-width: 900px) {
  .chan-row { grid-template-columns: 1fr; }
  .kit-modal { max-height: 92vh; padding: 1rem; }
  .kit-modal-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: .55rem; }
}
.form-grid { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.field { display: grid; gap: .4rem; }

.dropdown { position: relative; display: inline-block; }

  content: "▼"; margin-left: .4rem; opacity: .6; font-size: .65em;

.dropdown-menu {

  min-width: 140px; z-index: 100; box-shadow: 0 12px 40px rgba(0,0,0,.6);

  transition: opacity .15s, transform .15s;
}
.dropdown.open .dropdown-menu {
  opacity: 1; transform: translateY(0); pointer-events: all;
}
.dropdown-menu button {
  width: 100%; text-align: left; padding: .55rem .85rem; border: none;

.dropdown-menu button:last-child { border-radius: 0 0 var(--radius) var(--radius); }
.dropdown-menu button:hover { background: rgba(255,255,255,.05); }

          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="M11 12l7-7 3 3M16 7l2 2"/></svg>Keys</button>
        <button type="button" data-tab="logs" data-perm="logs">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v6h6M9 13h6M9 17h6"/></svg>Logs</button>
      </div>
    </div>

    <div class="nav-spacer"></div>
    <div class="nav-user">
      <div class="avatar" id="navAvatar">A</div>
      <div class="who">
        <b id="navUserName">Panel</b>
        <small id="navUserRole">—</small>
      </div>
    </div>
    <button class="ghost" id="logoutBtn" style="margin-top:.45rem;justify-content:flex-start;gap:.5rem">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 12H4M8 8l-4 4 4 4M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></svg>Log out</button>
    <div class="dev-banner" title="Astral Control is under active development">
      <strong>In development</strong>
      <span>Report bugs to <b>Penumbra</b> on Discord</span>
    </div>
    <div class="nav-foot" id="navMeta">—</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="title-wrap" style="display:flex;align-items:flex-start;gap:.75rem">
        <button type="button" class="desktop-nav-open ghost" id="desktopNavOpen" aria-label="Open menu" title="Open menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div>
          <h2 id="pageTitle">Home</h2>
          <p class="page-sub" id="pageSub">Server health and quick controls</p>
        </div>
      </div>
      <div class="pills" id="statusPills"></div>
    </div>
    <div class="subtabs page-subtabs" id="pageSubtabs"></div>
    <section id="view"></section>
  </main>
</div>
<div id="toast" class="toast hidden"></div>

<script>
const state = {
  tab: "overview",
  overview: null,
  consoleLog: [],
  loginFx: null,
  session: null,
  lastCreatedKey: null,
  kitDraft: {
    id: "",
    label: "",
    cooldownMinutes: 0,
    items: [], // { item, amount, name? }
    category: "All",
    query: "",
  },
  itemCatalog: null,
  autoSub: "messages",
  discordSub: "channels",
  reportQuery: "",
  socket: null,
  playerPositions: [],
  selectedPlayer: null,
  profileQuery: "",
  playerQuery: "",
  editingServerKit: null,
  editingServerKitData: null,
  kitBuilderOpen: false,
  statsCategory: "kills",
  analyticsData: null,
  mapCal: (() => {
    const defaults = {
      pad: 0,
      flipX: false,
      flipZ: false,
      rot180: false,
      swapXZ: false,
      sizeOverride: 0,
      samples: [],
      transform: null,
    };
    try {
      const raw = { ...defaults, ...JSON.parse(localStorage.getItem("astralMapCal") || "{}") };
      // Legacy absolute-pixel samples / axis-only affine break after canvas resize
      const samples = Array.isArray(raw.samples) ? raw.samples : [];
      const legacy =
        samples.some((s) => s == null || s.u == null || s.v == null) ||
        (raw.affine && raw.affine.ax != null && raw.transform == null);
      if (legacy) {
        raw.samples = [];
        raw.transform = null;
      }
      delete raw.affine;
      return raw;
    } catch {
      return { ...defaults };
    }
  })(),
  mapCalibrateIgn: null,
  mapDrawRect: null,
  mapImageBust: 0,
  mapResizeObs: null,
};

const NAV_SECTIONS = {
  home: {
    title: "Home",
    sub: "Server health and quick controls",
    tabs: [
      { id: "overview", label: "Overview", perm: "overview" },
      { id: "map", label: "Map", perm: "overview" },
    ],
  },
  players: {
    title: "Players",
    sub: "Online players, links, profiles, bans, and reports",
    tabs: [
      { id: "players", label: "Find", perm: "players" },
      { id: "profiles", label: "Profiles", perm: "players" },
      { id: "links", label: "Links", perm: "links" },
      { id: "bans", label: "Bans", perm: "ban" },
      { id: "reports", label: "Reports", perm: "reports" },
    ],
  },
  kits: {
    title: "Kits",
    sub: "Server kits + panel builder",
    tabs: [{ id: "kits", label: "Kits", perm: "kits" }],
  },
  community: {
    title: "Community",
    sub: "Leaderboards, automation, and events",
    tabs: [
      { id: "stats", label: "Leaderboard", perm: "stats" },
      { id: "automation", label: "Automation", perm: "automation" },
      { id: "events", label: "Events", perm: "schedule" },
    ],
  },
  server: {
    title: "Server",
    sub: "Status, wipe automation, and analytics",
    tabs: [
      { id: "status", label: "Status", perm: "overview" },
      { id: "wipe", label: "Wipe", perm: "overview" },
      { id: "analytics", label: "Analytics", perm: "overview" },
    ],
  },
};

const MAIN_TOOL_TABS = [
  { id: "commands", label: "Actions", perm: "serverCommands", title: "Actions", sub: "Give kits, ranks, and trigger events" },
  { id: "discord", label: "Discord", perm: "serverCommands", title: "Discord", sub: "Channels, feeds, VIP, and slash commands" },
];

const ADVANCED_TABS = [
  { id: "console", label: "RCON", perm: "rcon", title: "RCON", sub: "Raw RCON commands" },
  { id: "warps", label: "Warps", perm: "warps", title: "Warps", sub: "Warps and force teleports" },
  { id: "keys", label: "Keys", perm: "keys", title: "Keys", sub: "Staff access keys" },
  { id: "logs", label: "Logs", perm: "logs", title: "Logs", sub: "Panel actions and system audit trail" },
];

const TAB_META = {
  overview: { title: "Home", sub: "Server health and quick controls", perm: "overview" },
  map: { title: "Live map", sub: "Fullscreen radar — calibrate once, watch everyone move", perm: "overview" },
  players: { title: "Players", sub: "Search anyone — online roster below", perm: "players" },
  profiles: { title: "Players", sub: "Staff dossiers — stats, notes, actions", perm: "players" },
  links: { title: "Players", sub: "Discord ↔ IGN links", perm: "links" },
  bans: { title: "Players", sub: "Manage player bans", perm: "ban" },
  reports: { title: "Players", sub: "Combat log and trio group alerts", perm: "reports" },
  kits: { title: "Kits", sub: "Server kits + panel builder", perm: "kits" },
  stats: { title: "Community", sub: "Wipe leaderboards and player lookup", perm: "stats" },
  automation: { title: "Community", sub: "Auto messages and scheduled commands", perm: "automation" },
  events: { title: "Community", sub: "Automate RCON commands on a schedule", perm: "schedule" },
  status: { title: "Server", sub: "Live telemetry, map, wipe, and connections", perm: "overview" },
  wipe: { title: "Server", sub: "Checklist and one-click wipe automation", perm: "overview" },
  analytics: { title: "Server", sub: "Pop, FPS, and weapon stats", perm: "overview" },
};

for (const t of [...MAIN_TOOL_TABS, ...ADVANCED_TABS]) {
  TAB_META[t.id] = { title: t.title, sub: t.sub, perm: t.perm };
}

function normalizeTab(tab) {
  if (tab === "automsg" || tab === "schedule") return "automation";
  if (tab === "audit") return "logs";
  return tab;
}

function tabPerm(tab) {
  return TAB_META[tab]?.perm || tab;
}

function sectionForTab(tab) {
  tab = normalizeTab(tab);
  for (const [id, section] of Object.entries(NAV_SECTIONS)) {
    if (section.tabs.some((t) => t.id === tab)) return id;
  }
  if (ADVANCED_TABS.some((t) => t.id === tab)) return "advanced";
  return null;
}

function allowedTabs(tabs) {
  return tabs.filter((t) => can(t.perm));
}

function defaultTabForSection(sectionId) {
  const section = NAV_SECTIONS[sectionId];
  if (!section) return null;
  return allowedTabs(section.tabs)[0]?.id || null;
}

function firstAllowedTab() {
  for (const id of Object.keys(NAV_SECTIONS)) {
    const tab = defaultTabForSection(id);
    if (tab) return tab;
  }
  const tool = MAIN_TOOL_TABS.find((t) => can(t.perm));
  if (tool) return tool.id;
  const adv = ADVANCED_TABS.find((t) => can(t.perm));
  return adv?.id || "overview";
}

function can(perm) {
  if (!state.session) return false;
  if (state.session.role === "owner") return true;
  if (perm === "automation") return Boolean(state.session.permissions?.automessages || state.session.permissions?.schedule);
  return Boolean(state.session.permissions?.[perm]);
}

function setAdvancedOpen(open) {
  const root = document.getElementById("navAdvanced");
  const toggle = document.getElementById("advancedToggle");
  if (!root || !toggle) return;
  root.classList.toggle("open", open);
  toggle.setAttribute("aria-expanded", open ? "true" : "false");
  localStorage.setItem("advancedNavOpen", open ? "true" : "false");
}

function applyNavPermissions() {
  document.querySelectorAll(".nav [data-tab][data-perm]").forEach((btn) => {
    const allowed = can(btn.dataset.perm);
    btn.classList.toggle("hidden", !allowed);
  });

  for (const [id, section] of Object.entries(NAV_SECTIONS)) {
    const btn = document.querySelector(`.nav [data-nav="${id}"]`);
    if (!btn) continue;
    btn.classList.toggle("hidden", allowedTabs(section.tabs).length === 0);
  }

  const advVisible = ADVANCED_TABS.some((t) => can(t.perm));
  document.getElementById("navAdvanced")?.classList.toggle("hidden", !advVisible);

  state.tab = normalizeTab(state.tab);
  if (!can(tabPerm(state.tab))) {
    state.tab = firstAllowedTab();
  }
}

function syncNavActive() {
  const section = sectionForTab(state.tab);
  document.querySelectorAll(".nav [data-nav]").forEach((b) => {
    b.classList.toggle("active", b.dataset.nav === section);
  });
  document.querySelectorAll(".nav [data-tab]").forEach((b) => {
    b.classList.toggle("active", b.dataset.tab === state.tab);
  });
  if (section === "advanced") setAdvancedOpen(true);
}

function renderPageSubtabs() {
  const el = document.getElementById("pageSubtabs");
  if (!el) return;
  const sectionId = sectionForTab(state.tab);
  const section = sectionId ? NAV_SECTIONS[sectionId] : null;
  const tabs = section ? allowedTabs(section.tabs) : [];
  if (tabs.length <= 1) {
    el.innerHTML = "";
    return;
  }
  el.innerHTML = tabs
    .map(
      (t) =>
        `<button type="button" data-action="pageSub" data-tab="${t.id}" class="${t.id === state.tab ? "active" : ""}">${esc(t.label)}</button>`,
    )
    .join("");
}

function setNavOpen(open) {
  document.getElementById("app")?.classList.toggle("nav-open", open);
  document.body.style.overflow = open && window.matchMedia("(max-width: 900px)").matches ? "hidden" : "";
}

async function api(path, opts = {}) {
  const res = await fetch(`/admin/api${path}`, {
    credentials: "include",
    headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function toast(msg, bad = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.borderColor = bad ? "var(--bad)" : "var(--line)";
  el.classList.remove("hidden");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add("hidden"), 3200);
}

function fmtUptime(s) {
  if (!s && s !== 0) return "—";
  const h = Math.floor(s / 3600);
  const d = Math.floor(h / 24);
  return d ? `${d}d ${h % 24}h` : `${h}h ${Math.floor((s % 3600) / 60)}m`;
}

function stopLoginScene() {
  if (state.loginFx?.raf) cancelAnimationFrame(state.loginFx.raf);
  if (state.loginFx?.cleanups) state.loginFx.cleanups.forEach((fn) => fn());
  state.loginFx = null;
}

function initLoginScene() {
  // Simple login scene - no heavy animations
  const root = document.getElementById("login");
  if (!root || root.classList.contains("hidden")) return;
  state.loginFx = { cleanups: [] };
}

function stopLoginScene() {
  if (state.loginFx?.cleanups) {
    state.loginFx.cleanups.forEach((fn) => fn());
  }
  state.loginFx = null;
}

async function boot() {
  const session = await api("/session");
  document.getElementById("login").classList.toggle("hidden", session.authed);
  document.getElementById("app").classList.toggle("hidden", !session.authed);
  if (session.authed) {
    stopLoginScene();
    state.session = session;
    applyNavPermissions();
    setAdvancedOpen(localStorage.getItem("advancedNavOpen") === "true");
    const label = session.label || "Panel";
    const roleTxt = session.role === "owner" ? "OWNER" : "STAFF";
    document.getElementById("navMeta").textContent = `${label} · ${roleTxt}`;
    document.getElementById("navUserName").textContent = label;
    document.getElementById("navUserRole").textContent = roleTxt;
    document.getElementById("navAvatar").textContent = (label[0] || "A").toUpperCase();
    
    connectWebSocket();

    function setSidebarCollapsed(collapsed) {
      const app = document.getElementById("app");
      app.classList.toggle("sidebar-collapsed", collapsed);
      localStorage.setItem("sidebarCollapsed", collapsed ? "true" : "false");
    }
    document.getElementById("sidebarToggle")?.addEventListener("click", () => {
      setSidebarCollapsed(true);
    });
    document.getElementById("desktopNavOpen")?.addEventListener("click", () => {
      setSidebarCollapsed(false);
    });
    if (localStorage.getItem("sidebarCollapsed") === "true") {
      setSidebarCollapsed(true);
    }

    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "k") {
        e.preventDefault();
        openCommandPalette();
      }
    });
    
    if (can("overview")) await refreshOverview().catch(() => {});
    setTab(state.tab);
    // No timed full-page refresh — that wiped forms/focus. Use the Refresh
    // buttons on Status / Online when you want updated data.
  } else {
    state.session = null;
    initLoginScene();
  }
}

function isUserEditing() {
  const el = document.activeElement;
  if (!el || el === document.body) return false;
  const tag = el.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
  if (el.isContentEditable) return true;
  if (document.querySelector(".modal.show, .hud-modal.open, [data-modal='open']")) return true;
  return false;
}

function softRefreshLiveTab() {
  const o = state.overview || {};
  const server = o.server || {};
  const online = o.onlinePlayers || [];
  const n = server.players ?? online.length ?? 0;
  const max = server.maxPlayers ?? "?";

  document.querySelectorAll("[data-live='pop']").forEach((el) => {
    el.innerHTML = `${n}<span class="slash"> / ${max}</span>`;
  });
  document.querySelectorAll("[data-live='queued']").forEach((el) => {
    el.textContent = String(server.queued ?? 0);
  });
  document.querySelectorAll("[data-live='joining']").forEach((el) => {
    el.textContent = String(server.joining ?? 0);
  });
  document.querySelectorAll("[data-live='fps']").forEach((el) => {
    el.textContent = String(server.fps ?? "—");
  });
  document.querySelectorAll("[data-live='online-count']").forEach((el) => {
    el.textContent = String(online.length);
  });

  refreshStatusPills();
}

function connectWebSocket() {
  if (state.socket) return;
  
  state.socket = io({
    path: "/admin/socket.io",
    transports: ["websocket", "polling"],
  });

  state.socket.on("connect", () => {
    console.log("WebSocket connected");
  });

  state.socket.on("disconnect", () => {
    console.log("WebSocket disconnected");
  });

  state.socket.on("server:update", (data) => {
    if (state.overview) {
      Object.assign(state.overview.rcon, data.rcon || {});
      if (data.server) {
        Object.assign(state.overview.server, data.server);
      }
    }
    if (!isUserEditing()) softRefreshLiveTab();
  });

  state.socket.on("players:update", (players) => {
    state.playerPositions = players || [];
    if (state.tab !== "map" || isUserEditing()) return;
    const rows = document.getElementById("mapPlayerRows");
    const count = document.getElementById("mapOnlineCount");
    if (rows) rows.innerHTML = mapPlayerHudHtml(state.playerPositions);
    if (count) count.textContent = `Online (${state.playerPositions.length})`;
    const tracked = document.getElementById("mapTrackedHint");
    if (tracked) {
      const withCoords = state.playerPositions.filter((p) => p.coords).length;
      tracked.textContent = `${withCoords}/${state.playerPositions.length} tracked`;
    }
    drawMap();
  });

  // Live toasts only when you're looking at those tabs — otherwise they feel like random UI jumps.
  state.socket.on("kill:new", (data) => {
    if (document.hidden || isUserEditing()) return;
    if (state.tab === "overview" || state.tab === "status") {
      toast(`🔫 ${data.killer} killed ${data.victim}`);
    }
  });

  state.socket.on("player:join", (data) => {
    if (document.hidden || isUserEditing()) return;
    if (state.tab === "players") toast(`📥 ${data.ign} joined`);
  });

  state.socket.on("player:leave", (data) => {
    if (document.hidden || isUserEditing()) return;
    if (state.tab === "players") toast(`📤 ${data.ign} left`);
  });

  state.socket.on("alert:new", (data) => {
    toast(data.message, data.level === "error");
  });
}

function refreshStatusPills() {
  const o = state.overview || {};
  const pills = document.getElementById("statusPills");
  if (!pills) return;
  const r = o.rcon || {};
  // Pills removed - info now in Connections section
  pills.innerHTML = "";
}

async function refreshOverview() {
  if (!can("overview")) return;
  state.overview = await api("/overview");
  const pills = document.getElementById("statusPills");
  if (pills) pills.innerHTML = "";
}

function setTab(tab) {
  tab = normalizeTab(tab);
  if (!can(tabPerm(tab))) {
    tab = firstAllowedTab();
  }
  const tabChanged = state.tab !== tab;
  state.tab = tab;
  document.body.classList.toggle("map-mode", tab === "map");
  syncNavActive();
  const meta = TAB_META[tab] || { title: tab, sub: "" };
  const sectionId = sectionForTab(tab);
  const section = sectionId && sectionId !== "advanced" ? NAV_SECTIONS[sectionId] : null;
  document.getElementById("pageTitle").textContent =
    tab === "map" ? "Live map" : (section?.title || meta.title || tab);
  // Prefer tool-specific subtitle (Actions / Discord) over section blurb
  document.getElementById("pageSub").textContent = meta.sub || section?.sub || "";
  renderPageSubtabs();
  setNavOpen(false);
  render({ animate: tabChanged });
}

async function render({ animate = false } = {}) {
  document.body.classList.toggle("map-mode", state.tab === "map");
  const view = document.getElementById("view");
  if (animate) {
    view.style.animation = "none";
    void view.offsetWidth;
    view.style.animation = "";
  } else {
    view.style.animation = "none";
  }
  try {
    if (state.tab === "overview") view.innerHTML = renderOverview();
    if (state.tab === "map") view.innerHTML = await renderMap();
    if (state.tab === "players") view.innerHTML = await renderPlayers();
    if (state.tab === "profiles") view.innerHTML = await renderProfiles();
    if (state.tab === "commands") view.innerHTML = await renderServerCommands();
    if (state.tab === "discord") view.innerHTML = await renderDiscordChannels();
    if (state.tab === "console") view.innerHTML = renderConsole();
    if (state.tab === "stats") view.innerHTML = await renderStats();
    if (state.tab === "status") view.innerHTML = await renderServerStatus();
    if (state.tab === "wipe") view.innerHTML = await renderWipe();
    if (state.tab === "analytics") view.innerHTML = await renderAnalytics();
    if (state.tab === "warps") view.innerHTML = await renderWarps();
    if (state.tab === "links") view.innerHTML = await renderLinks();
    if (state.tab === "automation") view.innerHTML = await renderAutomation();
    if (state.tab === "kits") view.innerHTML = await renderKits();
    if (state.tab === "reports") view.innerHTML = await renderReports();
    if (state.tab === "bans") view.innerHTML = await renderBans();
    if (state.tab === "events") view.innerHTML = await renderEvents();
    if (state.tab === "keys") view.innerHTML = await renderKeys();
    if (state.tab === "logs") view.innerHTML = await renderLogs();
    bindView();
    if (state.tab === "analytics") {
      requestAnimationFrame(() => initAnalyticsCharts());
    }
  } catch (e) {
    view.innerHTML = `<div class="card"><p class="muted">${e.message}</p></div>`;
  }
}

function statCard(value, label, liveKey) {
  const inner = liveKey ? `<span data-live="${liveKey}">${value}</span>` : value;
  return `<div class="card stat"><div class="metric">${inner}<small>${esc(label)}</small></div></div>`;
}

function renderOverview() {
  const o = state.overview || { server: null, onlinePlayers: [], stats: {}, bot: {}, wipe: {}, rcon: {}, health: [] };
  const s = o.server || {};
  const r = o.rcon || {};
  const wipeAt = o.wipe?.wipeAt;
  const wipeLabel = wipeAt ? new Date(wipeAt).toLocaleString() : "Not set";
  const online = o.onlinePlayers || [];

  const rconPill = !r.enabled
    ? `<span class="pill warn">Not configured</span>`
    : r.connected
      ? `<span class="pill ok">Connected</span>`
      : `<span class="pill bad">Offline</span>`;
  const botPill = o.bot?.ready
    ? `<span class="pill ok">Ready</span>`
    : `<span class="pill bad">Down</span>`;
  const connectedSince = r.connectedAt
    ? esc(new Date(r.connectedAt).toLocaleString())
    : "—";
  const endpoint = r.host && r.port ? `${r.host}:${r.port}` : "—";

  const health = (o.health && o.health.length)
    ? o.health
    : [
        { id: "rcon", label: "RCON", status: r.connected ? "ok" : "bad", detail: r.connected ? "Connected" : "Offline" },
        { id: "discord", label: "Discord", status: o.bot?.ready ? "ok" : "bad", detail: o.bot?.ready ? "Ready" : "Down" },
      ];

  const healthStrip = `
    <div class="health-strip">
      ${health.map((h) => `
        <div class="health-card ${esc(h.status || "")}">
          <div class="h-label">${esc(h.label)}</div>
          <div class="h-value">${esc(h.status === "ok" ? "OK" : h.status === "bad" ? "Down" : "Check")}</div>
          <div class="h-detail">${esc(h.detail || "")}</div>
        </div>`).join("")}
    </div>`;

  const quick = `
    <div class="quick-actions">
      ${can("players") ? `<button data-action="goTab" data-tab="players">Find player</button>` : ""}
      ${can("serverCommands") ? `<button data-action="goTab" data-tab="commands">Give kit / rank</button>` : ""}
      ${can("serverCommands") ? `<button data-action="goTab" data-tab="discord">Discord settings</button>` : ""}
      ${can("overview") ? `<button data-action="goTab" data-tab="wipe">Wipe tools</button>` : ""}

async function renderAutomation() {
  if (!state.autoSub) state.autoSub = can("automessages") ? "messages" : "jobs";
  if (state.autoSub === "messages" && !can("automessages")) state.autoSub = "jobs";
  if (state.autoSub === "jobs" && !can("schedule") && can("automessages")) state.autoSub = "messages";

  const sub = state.autoSub;
  const tabs = `
    <div class="subtabs">
      ${can("automessages") ? `<button type="button" data-action="autoSub" data-sub="messages" class="${sub === "messages" ? "active" : ""}">Messages</button>` : ""}
      ${can("schedule") ? `<button type="button" data-action="autoSub" data-sub="jobs" class="${sub === "jobs" ? "active" : ""}">Commands</button>` : ""}
    </div>`;

  if (sub === "jobs" && can("schedule")) {
    const data = await api("/schedule");
    const rows = data.jobs.map((j) => `
      <tr>

  const data = await api("/automessages");

          <div class="table-wrap"><table class="table"><thead><tr><th>Text</th><th>Every</th><th></th><th></th></tr></thead><tbody>${rows}</tbody></table></div>

function renderSettingField(kind, groupKey, field) {
  const id = `${kind}-${groupKey}-${field.key}`;
  const hint = field.hint ? `<small>${esc(field.hint)}</small>` : "";
  const dataAttrs = `data-${kind}="${esc(groupKey)}" data-${kind}-field="${esc(field.key)}"`;
  if (field.type === "toggle") {
    return `
      <div class="feed-field toggle">
        <label for="${esc(id)}">
          <input type="checkbox" id="${esc(id)}" ${dataAttrs} ${field.value ? "checked" : ""} />
          <span>${esc(field.label)}${hint}</span>
        </label>
      </div>`;
  }
  if (field.type === "select") {
    const opts = (field.options || []).map((o) =>
      `<option value="${esc(o.value)}" ${o.value === field.value ? "selected" : ""}>${esc(o.label)}</option>`
    ).join("");
    return `
      <div class="feed-field">
        <label for="${esc(id)}">${esc(field.label)}${hint}</label>
        <select id="${esc(id)}" ${dataAttrs}>${opts}</select>
      </div>`;
  }
  if (field.type === "number") {
    const min = field.min != null ? ` min="${field.min}"` : "";
    const max = field.max != null ? ` max="${field.max}"` : "";
    return `
      <div class="feed-field">
        <label for="${esc(id)}">${esc(field.label)}${hint}</label>
        <input type="number" id="${esc(id)}" ${dataAttrs} value="${esc(field.value ?? "")}"${min}${max} />
      </div>`;
  }
  return `
    <div class="feed-field">
      <label for="${esc(id)}">${esc(field.label)}${hint}</label>
      <input type="text" id="${esc(id)}" ${dataAttrs}
        value="${esc(field.value ?? "")}" placeholder="${esc(field.placeholder || "")}" />
    </div>`;
}

function renderFeedField(feedKey, field) {
  return renderSettingField("feed", feedKey, field);
}

function renderCommandField(cmdKey, field) {
  return renderSettingField("cmd", cmdKey, field);
}

async function renderDiscordChannels() {
  const DISCORD_SUBS = [
    { id: "channels", label: "Channels", hint: "Pick where each feed posts. Panel values override .env." },
    { id: "status", label: "Status", hint: "How pop / wipe voice channels are renamed." },
    { id: "feeds", label: "Feeds", hint: "What gets posted — killfeed filters and feed toggles." },
    { id: "vip", label: "VIP", hint: "Discord role, kit id, claim phrase, and cooldowns." },
    { id: "slash", label: "Slash cmds", hint: "Turn Discord slash commands on/off and tweak options." },
  ];
  const valid = new Set(DISCORD_SUBS.map((s) => s.id));
  if (!valid.has(state.discordSub)) state.discordSub = "channels";
  const sub = state.discordSub;
  const meta = DISCORD_SUBS.find((s) => s.id === sub) || DISCORD_SUBS[0];

  const pageSubEl = document.getElementById("pageSub");
  if (pageSubEl) pageSubEl.textContent = meta.hint;

  const data = await api("/channels");

  let body = "";
  let saveAction = "";
  let saveLabel = "";

  if (sub === "channels") {
    saveAction = "saveChannels";
    saveLabel = "Save channels";
    const blocks = Object.entries(groups).map(([group, rows]) => `
      <div class="card" style="margin-bottom:.75rem">
        <h3>${esc(group)}</h3>
        <div class="chan-grid">

            const selectOpts = [`<option value="">— unset —</option>`]
              .concat((data.discordChannels || []).map((c) =>
                `<option value="${esc(c.id)}" ${c.id === ch.value ? "selected" : ""}>#${esc(c.name)}${c.type === "voice" ? " (voice)" : ""}${c.parent ? ` · ${esc(c.parent)}` : ""}</option>`
              )).join("");
            const srcClass = ch.source === "panel" ? "panel" : ch.source === "env" ? "env" : "unset";
            return `
            <div class="chan-row">
              <label>${esc(ch.label)}
                <small>${esc(ch.hint || ch.env)}

                </small>
              </label>
              <select data-channel-key="${esc(ch.key)}">${selectOpts}</select>
              <input data-channel-manual="${esc(ch.key)}" placeholder="or paste id" value="${esc(ch.value || "")}" />
            </div>`;
          }).join("")}
        </div>
      </div>`).join("") || `<div class="card"><div class="empty">No channel slots</div></div>`;
    body = `
      <p class="discord-intro">Only set the channels you use. Killfeed → Feeds group. Pop / wipe renames → Status group (voice channels work best).</p>
      ${blocks}`;
  } else if (sub === "status") {
    saveAction = "saveStatusDisplays";
    saveLabel = "Save status displays";
    const statusBlocks = (data.statusDisplays || []).map((block) => `
      <div class="card feed-setting-card" style="margin-bottom:.75rem">
        <h3>${esc(block.label)}</h3>
        <p class="muted" style="font-family:var(--mono);font-size:.72rem">${esc(block.hint || "")}</p>
        <div class="feed-field-grid">
          ${(block.fields || []).map((f) => renderSettingField("status", block.key, f)).join("")}

      </div>`).join("") || `<div class="card"><div class="empty">No status display settings</div></div>`;
    body = `
      <p class="discord-intro">Formats for live pop / wipe countdown channel names. Assign the channels under <b>Channels → Status</b>.</p>
      <div class="feed-settings-grid">${statusBlocks}</div>`;
  } else if (sub === "feeds") {
    saveAction = "saveFeeds";
    saveLabel = "Save feed settings";
    const feedBlocks = (data.feeds || []).map((feed) => `
      <div class="card feed-setting-card" style="margin-bottom:.75rem">
        <h3>${esc(feed.label)}</h3>
        <p class="muted" style="font-family:var(--mono);font-size:.72rem">${esc(feed.hint || "")}</p>
        <div class="feed-field-grid">
          ${(feed.fields || []).map((f) => renderFeedField(feed.key, f)).join("")}
        </div>
      </div>`).join("") || `<div class="card"><div class="empty">No feed settings</div></div>`;
    body = `
      <p class="discord-intro">Killfeed defaults to compact PvP only. Turn on NPC / animal / suicide lines only if you want the spam.</p>
      <div class="feed-settings-grid">${feedBlocks}</div>`;
  } else if (sub === "vip") {
    saveAction = "saveVip";
    saveLabel = "Save VIP settings";
    const vipFields = (data.vip?.fields || []).map((field) => {
      if (field.key === "roleId") {
        const id = "vip-roleId";
        const selectOpts = [`<option value="">— unset —</option>`]
          .concat((data.discordRoles || []).map((r) =>

          )).join("");
        return `

            <label for="${id}">${esc(field.label)}${field.hint ? `<small>${esc(field.hint)}</small>` : ""}</label>
            <select id="${id}" data-vip-field="roleId">${selectOpts}</select>

          </div>`;
      }
      return renderSettingField("vip", "vip", { ...field, key: field.key });
    }).join("") || `<div class="empty">No VIP settings</div>`;
    body = `
      <p class="discord-intro">Players with the VIP role claim via quick chat (default <code>I need water</code>). Kit id defaults to <code>vipkit</code>.</p>
      <div class="card"><div class="feed-field-grid">${vipFields}</div></div>`;
  } else {
    saveAction = "saveCommands";

    const commandBlocks = (data.commandGroups || []).map((g) => `

        <h3>${esc(g.group)}</h3>

              <code>${esc(cmd.name)}</code>
              <span class="cmd-access ${esc(cmd.access || "public")}">${esc(cmd.access || "public")}</span>
              <span class="cmd-desc">${esc(cmd.description || "")}</span>

            <div class="feed-field-grid">

      </div>`).join("") || `<div class="card"><div class="empty">No slash commands registered</div></div>`;
    body = `
      <p class="discord-intro">Disable a command to block it immediately. Homes / TPR / giveaway extras apply when saved. Discord’s command list only updates after <code>npm run register-commands</code>.</p>
      <div class="cmd-catalog">${commandBlocks}</div>`;
  }

  return `
    <div class="discord-shell">
      ${tabs}
      ${body}
      <div class="discord-actions">
        <span class="hint">${esc(meta.label)}</span>
        <button class="primary" data-action="${esc(saveAction)}">${esc(saveLabel)}</button>
      </div>
    </div>`;
}

function fmtPlaytimeMs(ms) {
  const n = Number(ms) || 0;
  if (n <= 0) return "0m";
  const totalMin = Math.floor(n / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h <= 0) return `${m}m`;
  return `${h}h ${m}m`;
}

function hash2(x, y, seed) {
  let n = Math.imul(x, 374761393) + Math.imul(y, 668265263) + seed;
  n = (n ^ (n >>> 13)) >>> 0;
  n = Math.imul(n, 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}

function smoothNoise(x, y, seed) {
  const x0 = Math.floor(x);
  const y0 = Math.floor(y);
  const fx = x - x0;
  const fy = y - y0;
  const sx = fx * fx * (3 - 2 * fx);
  const sy = fy * fy * (3 - 2 * fy);
  const a = hash2(x0, y0, seed);
  const b = hash2(x0 + 1, y0, seed);
  const c = hash2(x0, y0 + 1, seed);
  const d = hash2(x0 + 1, y0 + 1, seed);
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}

function fbm(x, y, seed) {
  let v = 0;
  let amp = 0.5;
  let freq = 1;
  for (let i = 0; i < 5; i++) {
    v += smoothNoise(x * freq, y * freq, seed + i * 1013) * amp;
    amp *= 0.5;
    freq *= 2;
  }
  return v;
}

function drawProceduralTerrain(ctx, w, h, seed) {
  const s = Number(seed) || 1;
  const img = ctx.createImageData(w, h);
  const data = img.data;
  for (let py = 0; py < h; py++) {
    for (let px = 0; px < w; px++) {
      const nx = px / w;
      const ny = py / h;
      const dx = nx - 0.5;
      const dy = ny - 0.5;
      const dist = Math.sqrt(dx * dx + dy * dy) * 2;
      const elev = fbm(nx * 4, ny * 4, s) - dist * 0.55;
      const moist = fbm(nx * 3 + 40, ny * 3 + 40, s + 99);
      const i = (py * w + px) * 4;
      let r; let g; let b;
      if (elev < 0.08) {
        // ocean
        const deep = Math.max(0, Math.min(1, (0.08 - elev) * 4));
        r = 18 + deep * 8;
        g = 48 + deep * 20;
        b = 72 + deep * 40;
      } else if (elev < 0.14) {
        // shore
        r = 194; g = 178; b = 128;
      } else if (moist < 0.35 && elev < 0.55) {
        // arid
        r = 176 + elev * 40; g = 142; b = 82;
      } else if (elev > 0.72 || (moist > 0.65 && elev > 0.55)) {
        // arctic / snow peaks
        r = 210 + elev * 30; g = 220; b = 230;
      } else if (moist > 0.55) {
        // tundra / forest
        r = 58 + elev * 40; g = 98 + elev * 50; b = 62;
      } else {
        // temperate grass
        r = 72 + elev * 50; g = 118 + elev * 40; b = 58;
      }
      // subtle grid roads-ish noise
      const road = smoothNoise(nx * 18, ny * 18, s + 7);
      if (elev > 0.16 && road > 0.82) {
        r = (r + 90) / 2; g = (g + 80) / 2; b = (b + 60) / 2;
      }
      data[i] = Math.min(255, r);
      data[i + 1] = Math.min(255, g);
      data[i + 2] = Math.min(255, b);
      data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  // grid overlay
  ctx.strokeStyle = "rgba(255,255,255,0.08)";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    const x = (i / 10) * w;
    const y = (i / 10) * h;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
}
