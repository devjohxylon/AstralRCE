function fitContain(imgW, imgH, boxW, boxH) {
  if (!imgW || !imgH) return { dx: 0, dy: 0, dw: boxW, dh: boxH };
  const scale = Math.min(boxW / imgW, boxH / imgH);
  const dw = imgW * scale;
  const dh = imgH * scale;
  return {
    dx: (boxW - dw) / 2,
    dy: (boxH - dh) / 2,
    dw,
    dh,
  };
}

function uvToPixel(u, v, rect) {
  return {
    x: rect.dx + Number(u) * rect.dw,
    y: rect.dy + Number(v) * rect.dh,
  };
}

function pixelToUv(px, py, rect) {
  if (!rect?.dw || !rect?.dh) return null;
  const u = (px - rect.dx) / rect.dw;
  const v = (py - rect.dy) / rect.dh;
  if (![u, v].every(Number.isFinite)) return null;
  return { u, v };
}

/** Apply axis flips / padding → normalized image UV (0–1). */
function standardWorldToUv(wx, wz, mapSize, cal = state.mapCal) {
  let x = Number(wx);
  let z = Number(wz);
  if (!Number.isFinite(x) || !Number.isFinite(z)) return null;

  if (cal?.swapXZ) {
    const t = x;
    x = z;
    z = t;
  }
  if (cal?.rot180) {
    x = -x;
    z = -z;
  }
  if (cal?.flipX) x = -x;
  if (cal?.flipZ) z = -z;

  const size = Number(cal?.sizeOverride) > 0 ? Number(cal.sizeOverride) : mapSize;
  if (!size || size <= 0) return null;

  let nx = (x + size / 2) / size;
  let nz = (z + size / 2) / size;
  const pad = Math.max(0, Math.min(0.3, (Number(cal?.pad) || 0) / 100));
  const usable = 1 - 2 * pad;
  nx = pad + nx * usable;
  nz = pad + nz * usable;

  return { u: nx, v: 1 - nz };
}

/**
 * Similarity (uniform scale + rotation + translation) from 2 UV samples,
 * or least-squares full affine with 3+.
 * Maps world (wx,wz) → image UV (u,v) so resize never invalidates calibration.
 */
function rebuildMapTransform() {
  const samples = (state.mapCal?.samples || []).filter(
    (s) => s && Number.isFinite(s.wx) && Number.isFinite(s.wz) && Number.isFinite(s.u) && Number.isFinite(s.v),
  );
  if (!state.mapCal) return;
  if (samples.length < 2) {
    state.mapCal.transform = null;
    return;
  }

  if (samples.length === 2) {
    const a = samples[0];
    const b = samples[1];
    const dwx = b.wx - a.wx;
    const dwz = b.wz - a.wz;
    const du = b.u - a.u;
    const dv = b.v - a.v;
    const worldDist = Math.hypot(dwx, dwz);
    const uvDist = Math.hypot(du, dv);
    if (worldDist < 40 || uvDist < 0.02) {
      state.mapCal.transform = null;
      return;
    }
    const scale = uvDist / worldDist;
    const rot = Math.atan2(dv, du) - Math.atan2(dwz, dwx);
    const cos = Math.cos(rot);
    const sin = Math.sin(rot);
    const a11 = scale * cos;
    const a12 = -scale * sin;
    const a21 = scale * sin;
    const a22 = scale * cos;
    const tx = a.u - (a11 * a.wx + a12 * a.wz);
    const ty = a.v - (a21 * a.wx + a22 * a.wz);
    state.mapCal.transform = { a11, a12, a21, a22, tx, ty, kind: "similarity" };
    return;
  }

  // 3+ points: least-squares affine
  let sxx = 0, sxz = 0, szz = 0, sx = 0, sz = 0, n = 0;
  let sux = 0, suz = 0, su = 0, svx = 0, svz = 0, sv = 0;
  for (const s of samples) {
    sxx += s.wx * s.wx;
    sxz += s.wx * s.wz;
    szz += s.wz * s.wz;
    sx += s.wx;
    sz += s.wz;
    sux += s.u * s.wx;
    suz += s.u * s.wz;
    su += s.u;
    svx += s.v * s.wx;
    svz += s.v * s.wz;
    sv += s.v;
    n += 1;
  }

  function solve3(m00, m01, m02, m10, m11, m12, m20, m21, m22, r0, r1, r2) {
    const det =
      m00 * (m11 * m22 - m12 * m21) -
      m01 * (m10 * m22 - m12 * m20) +
      m02 * (m10 * m21 - m11 * m20);
    if (!Number.isFinite(det) || Math.abs(det) < 1e-12) return null;
    const inv = 1 / det;
    const c0 =
      inv *
      (r0 * (m11 * m22 - m12 * m21) -
        m01 * (r1 * m22 - m12 * r2) +
        m02 * (r1 * m21 - m11 * r2));
    const c1 =
      inv *
      (m00 * (r1 * m22 - m12 * r2) -
        r0 * (m10 * m22 - m12 * m20) +
        m02 * (m10 * r2 - r1 * m20));
    const c2 =
      inv *
      (m00 * (m11 * r2 - r1 * m21) -
        m01 * (m10 * r2 - r1 * m20) +
        r0 * (m10 * m21 - m11 * m20));
    return [c0, c1, c2];
  }

  const rowU = solve3(sxx, sxz, sx, sxz, szz, sz, sx, sz, n, sux, suz, su);
  const rowV = solve3(sxx, sxz, sx, sxz, szz, sz, sx, sz, n, svx, svz, sv);
  if (!rowU || !rowV) {
    state.mapCal.transform = null;
    return;
  }
  state.mapCal.transform = {
    a11: rowU[0],
    a12: rowU[1],
    a21: rowV[0],
    a22: rowV[1],
    tx: rowU[2],
    ty: rowV[2],
    kind: "affine",
  };
}

function applyTransform(wx, wz, t) {
  if (!t) return null;
  const x = Number(wx);
  const z = Number(wz);
  if (!Number.isFinite(x) || !Number.isFinite(z)) return null;
  return {
    u: t.a11 * x + t.a12 * z + t.tx,
    v: t.a21 * x + t.a22 * z + t.ty,
  };
}

function worldToMapPixel(wx, wz, mapSize, rect, cal = state.mapCal) {
  if (!rect) return null;

  const locked = cal?.transform;
  if (locked && Number.isFinite(locked.a11)) {
    const uv = applyTransform(wx, wz, locked);
    if (!uv) return null;
    return uvToPixel(uv.u, uv.v, rect);
  }

  const base = standardWorldToUv(wx, wz, mapSize, cal);
  if (!base) return null;

  const samples = (cal?.samples || []).filter(
    (s) => s && Number.isFinite(s.u) && Number.isFinite(s.v),
  );
  if (samples.length === 1) {
    const s = samples[0];
    const expected = standardWorldToUv(s.wx, s.wz, mapSize, cal);
    if (expected) {
      return uvToPixel(base.u + (s.u - expected.u), base.v + (s.v - expected.v), rect);
    }
  }
  return uvToPixel(base.u, base.v, rect);
}

function mapCalModeLabel() {
  const cal = state.mapCal || {};
  const n = (cal.samples || []).length;
  if (cal.transform) return `${cal.transform.kind === "affine" ? "Affine" : "2-point"} lock · ${n} marks`;
  if (n === 1) return "1-point offset · 1/2 marks";
  return `not calibrated · ${n}/2 marks`;
}

function ensureMapResizeObserver() {
  const stage = document.querySelector(".map-stage");

  });

function drawMap() {
  const canvas = document.getElementById("mapCanvas");
  if (!canvas) return;

  const ctx = canvas.getContext("2d");
  const img = document.getElementById("mapImage");
  const stage = canvas.parentElement;
  const cw = Math.max(320, Math.round(stage?.clientWidth || window.innerWidth || 800));
  const ch = Math.max(320, Math.round(stage?.clientHeight || window.innerHeight || 800));

  if (canvas.width !== cw || canvas.height !== ch) {
    canvas.width = cw;
    canvas.height = ch;
  }
  canvas.style.width = "100%";
  canvas.style.height = "100%";

  ctx.fillStyle = "#050506";
  ctx.fillRect(0, 0, cw, ch);

  const waitingPhoto = img && img.getAttribute("src") && !(img.complete && img.naturalWidth > 0);
  const hasPhoto = img && img.complete && img.naturalWidth > 0;
  let rect = { dx: 0, dy: 0, dw: cw, dh: ch };

  if (hasPhoto) {
    rect = fitContain(img.naturalWidth, img.naturalHeight, cw, ch);
    ctx.drawImage(img, rect.dx, rect.dy, rect.dw, rect.dh);
    img.style.display = "none";
  } else if (waitingPhoto) {
    ctx.fillStyle = "#6b7280";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Loading map image…", cw / 2, ch / 2);
    ctx.textAlign = "start";
    state.mapDrawRect = rect;
    return;
  } else {
    const seed = state.overview?.server?.mapSeed || 1;
    const box = Math.min(cw, ch);
    const ox = (cw - box) / 2;
    const oy = (ch - box) / 2;
    ctx.save();
    ctx.translate(ox, oy);
    drawProceduralTerrain(ctx, box, box, seed);
    ctx.restore();
    rect = { dx: ox, dy: oy, dw: box, dh: box };
  }

  state.mapDrawRect = rect;

  const MAP_SIZE = Number(state.overview?.server?.mapSize) || 4000;
  const players = state.playerPositions || [];
  const cal = state.mapCal || {};
  const dotR = Math.max(5, Math.min(10, Math.round(Math.min(cw, ch) / 110)));
  const fontPx = Math.max(11, Math.min(15, Math.round(Math.min(cw, ch) / 70)));

  for (const s of cal.samples || []) {
    if (!Number.isFinite(s.u) || !Number.isFinite(s.v)) continue;
    const mark = uvToPixel(s.u, s.v, rect);
    ctx.strokeStyle = "#60a5fa";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(mark.x, mark.y, dotR + 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = "#60a5fa";
    ctx.font = `bold ${fontPx}px sans-serif`;
    ctx.fillText("✓", mark.x - 4, mark.y + 4);
  }

  const x0 = rect.dx;
  const y0 = rect.dy;
  const x1 = rect.dx + rect.dw;
  const y1 = rect.dy + rect.dh;

  players.forEach((p) => {
    if (!p.coords) return;
    const pt = worldToMapPixel(p.coords.x, p.coords.z, MAP_SIZE, rect, cal);
    if (!pt || !Number.isFinite(pt.x) || !Number.isFinite(pt.y)) return;

    const onMap = pt.x >= x0 && pt.x <= x1 && pt.y >= y0 && pt.y <= y1;
    const x = pt.x;
    const y = pt.y;

    ctx.shadowColor = "rgba(0,0,0,0.85)";
    ctx.shadowBlur = 6;

    ctx.globalAlpha = onMap ? 1 : 0.35;
    ctx.fillStyle = onMap ? "#ff6b73" : "#9ca3af";
    ctx.beginPath();
    ctx.arc(x, y, onMap ? dotR : Math.max(3, dotR - 2), 0, Math.PI * 2);
    ctx.fill();

    if (onMap) {
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(x, y, Math.max(2, Math.round(dotR * 0.4)), 0, Math.PI * 2);
      ctx.fill();
    }

    const label = p.ign;
    ctx.font = `bold ${fontPx}px sans-serif`;
    const tw = ctx.measureText(label).width;
    let lx = x + dotR + 6;
    if (lx + tw > cw - 8) lx = x - tw - dotR - 6;
    lx = Math.max(6, Math.min(lx, cw - tw - 6));
    const ly = Math.max(fontPx + 2, Math.min(y + 4, ch - 6));

    ctx.shadowBlur = 3;
    ctx.fillStyle = onMap ? "#fff" : "#9ca3af";
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 3;
    ctx.strokeText(label, lx, ly);
    ctx.fillText(label, lx, ly);

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  });
}

        <strong style="display:block;font-size:.8rem">${esc(row.name || row.item)}</strong>

             data-kit-amount="${idx}"

function kitCatalogHtml(catalog) {
  const q = (state.kitDraft.query || "").trim().toLowerCase();
  const cat = state.kitDraft.category || "All";
  let rows = catalog.items || [];
  if (cat && cat !== "All") rows = rows.filter((i) => i.category === cat);
  if (q) {
    rows = rows.filter((i) =>
      i.id.includes(q) || i.name.toLowerCase().includes(q) || i.category.toLowerCase().includes(q),
    );
  }
  const shown = rows.slice(0, 80);
  if (!shown.length) {
    return `<div class="empty" style="padding:2rem 1rem">No matches<span class="empty-hint">Try different keywords</span></div>`;
  }
  return shown.map((i) => `
    <button type="button" class="kit-item" data-action="kitAddItem" data-id="${esc(i.id)}" data-name="${esc(i.name)}">
      <img src="https://rustlabs.com/img/items180/${esc(i.id)}.png" 
           onerror="this.style.display='none'" 
           style="width:40px;height:40px;object-fit:contain;border-radius:6px;background:rgba(0,0,0,.4);padding:4px" 
           alt="${esc(i.name)}" />
      <div style="flex:1;min-width:0;text-align:left">
        <strong style="display:block;font-size:.78rem">${esc(i.name)}</strong>
        <div class="meta">${esc(i.category)}</div>
      </div>
      <span class="add">+</span>
    </button>`).join("") + (rows.length > shown.length
      ? `<div class="muted" style="padding:.7rem;text-align:center;font-family:var(--mono);font-size:.68rem;border-top:1px solid rgba(255,255,255,.04)">+${rows.length - shown.length} more — refine search</div>`
      : "");
}

function bindKitBuilderEvents() {
  const search = document.getElementById("kitSearch");
  if (search) {
    search.oninput = () => {
      state.kitDraft.query = search.value;
      const catalogEl = document.getElementById("kitCatalog");
      if (catalogEl && state.itemCatalog) catalogEl.innerHTML = kitCatalogHtml(state.itemCatalog);
      bindKitBuilderEvents();
    };
  }
  document.querySelectorAll("[data-kit-amount]").forEach((input) => {
    input.onchange = () => syncKitDraftFromForm();
  });

  // Re-bind after catalog/picked DOM refreshes (bindView only runs once per full render)
  document.querySelectorAll('[data-action="kitAddItem"], [data-action="kitRemoveItem"], [data-action="kitCategory"], [data-action="kitAddCustom"], [data-action="kitClearDraft"], [data-action="saveKit"]').forEach((el) => {
    el.onclick = async () => {
      const a = el.dataset.action;
      try {
        if (a === "kitAddItem") {
          syncKitDraftFromForm();
          const id = el.dataset.id;
          const name = el.dataset.name || id;
          const existing = state.kitDraft.items.find((i) => i.item === id);
          if (existing) existing.amount += 1;
          else state.kitDraft.items.push({ item: id, amount: 1, name });
          refreshKitBuilderDom();
          return;
        }
        if (a === "kitAddCustom") {
          syncKitDraftFromForm();
          const raw = document.getElementById("kitCustomItem")?.value?.trim().toLowerCase();
          if (!raw || !/^[a-z0-9._-]+$/.test(raw)) { toast("Invalid shortname", true); return; }
          const existing = state.kitDraft.items.find((i) => i.item === raw);
          if (existing) existing.amount += 1;
          else state.kitDraft.items.push({ item: raw, amount: 1, name: raw });
          document.getElementById("kitCustomItem").value = "";
          refreshKitBuilderDom();
          return;
        }
        if (a === "kitRemoveItem") {
          syncKitDraftFromForm();
          state.kitDraft.items.splice(Number(el.dataset.idx), 1);
          refreshKitBuilderDom();
          return;
        }
        if (a === "kitCategory") {
          syncKitDraftFromForm();
          state.kitDraft.category = el.dataset.cat || "All";
          refreshKitBuilderDom();
          return;
        }
        if (a === "kitClearDraft") {
          state.kitDraft = { id: "", label: "", cooldownMinutes: 0, items: [], category: "All", query: "" };
          render();
          return;
        }
        if (a === "saveKit") {
          syncKitDraftFromForm();
          const items = state.kitDraft.items.map((i) => ({
            item: i.item,
            amount: Math.max(1, Number(i.amount) || 1),
          }));
          if (!items.length) { toast("Add at least one item", true); return; }
          await api("/kits", {
            method: "POST",
            body: {
              id: state.kitDraft.id || document.getElementById("kitId").value,
              label: state.kitDraft.label || document.getElementById("kitLabel").value,
              cooldownMinutes: state.kitDraft.cooldownMinutes,
              items,
            },
          });
          toast("Kit saved");
          state.kitDraft = { id: "", label: "", cooldownMinutes: 0, items: [], category: "All", query: "" };
          state.kitBuilderOpen = false;
          render();
        }
      } catch (e) {
        toast(e.message, true);
      }
    };
  });
}

function formatLogDetail(detail) {
  if (detail == null || detail === "") return "—";
  if (typeof detail !== "object") return esc(String(detail));
  const keys = Object.keys(detail);
  if (!keys.length) return "—";

  if (Array.isArray(detail.keys) && keys.length === 1) {
    return `<div class="log-chips">${detail.keys.map((k) =>
      `<span class="log-chip">${esc(k)}</span>`
    ).join("")}</div>`;
  }

  return keys.map((k) => {
    const raw = detail[k];
    let val;
    if (raw == null) val = "—";
    else if (typeof raw === "object") val = JSON.stringify(raw);
    else val = String(raw);
    if (val.length > 90) val = `${val.slice(0, 87)}…`;
    return `<span class="log-kv"><span class="log-k">${esc(k)}</span>${esc(val)}</span>`;
  }).join("");
}

      at: e.at,
      who: e.by || "—",
      role: e.role || "",
      action: e.action,
      detail: e.detail,
      source: "panel",
    })),
    ...(system.entries || []).map((e) => ({
      at: e.timestamp,
      who: e.admin || "System",
      role: "",
      action: e.action,
      detail: e.details || (e.target ? { target: e.target } : null),
      source: "system",
    })),
  ]
    .filter((e) => e.at)
    .sort((a, b) => new Date(b.at) - new Date(a.at))
    .slice(0, 200);

  const rows = merged.map((e) => `
    <tr>
      <td data-label="When" class="muted">${new Date(e.at).toLocaleString()}</td>
      <td data-label="Who">
        <strong>${esc(e.who)}</strong>
        ${e.role ? `<div class="muted" style="font-size:.65rem">${esc(e.role)}</div>` : ""}
      </td>
      <td data-label="Action"><code>${esc(e.action)}</code></td>
      <td data-label="Source"><span class="log-source ${esc(e.source)}">${esc(e.source)}</span></td>
      <td data-label="Detail" class="log-detail muted">${formatLogDetail(e.detail)}</td>
    </tr>`).join("") || `<tr><td colspan="5"><div class="empty">No log entries yet<span class="empty-hint">Panel actions and system events will show here</span></div></td></tr>`;

  return `
    <div class="card">
      <div class="card-head">
        <h3>Logs</h3>
        <span class="pill info">${merged.length} entries</span>
      </div>
      <p class="card-desc">Panel actions and system audit in one place. Detail chips stay wrapped so the table doesn’t blow out.</p>
      <div class="table-wrap"><table class="table">
        <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Source</th><th>Detail</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
}

async function renderBans() {
  const data = await api("/bans");
  const bans = data.bans || [];
  const history = data.history || [];
  const syncNote = data.sync?.added
    ? ` · synced ${data.sync.added} from server`
    : data.sync?.parsed
      ? ` · server list matched (${data.sync.parsed})`
      : "";

  function banRows(list, { inactive = false } = {}) {
    return list.map((b) => {
      const expires = b.expiresAt ? new Date(b.expiresAt).toLocaleString() : "Never";
      const when = b.bannedAt ? new Date(b.bannedAt).toLocaleString() : "—";
      const reason = String(b.reason || "").trim() || "—";
      const unbanNote = inactive && b.unbanReason
        ? `<div class="muted" style="font-family:var(--mono);font-size:.65rem;margin-top:.25rem">Unban: ${esc(b.unbanReason)}${b.unbannedBy ? ` · ${esc(b.unbannedBy)}` : ""}</div>`
        : "";
      return `
      <tr>
        <td data-label="Player"><strong>${esc(b.ign)}</strong></td>
        <td data-label="Reason"><strong style="font-weight:600">${esc(reason)}</strong>${unbanNote}</td>
        <td data-label="Admin">${esc(b.admin || "—")}</td>
        <td data-label="Banned">${esc(when)}</td>
        <td data-label="${inactive ? "Unbanned" : "Expires"}">${inactive ? esc(b.unbannedAt ? new Date(b.unbannedAt).toLocaleString() : "—") : esc(expires)}</td>
        <td data-label="Actions" class="actions">
          ${!inactive && can("ban") ? `<button class="danger" data-action="unban" data-ign="${esc(b.ign)}">Unban</button>` : `<span class="muted">${esc(b.source || "")}</span>`}

      <div class="table-wrap"><table class="table">
        <thead><tr><th>Player</th><th>Reason</th><th>Admin</th><th>Banned</th><th>Expires</th><th></th></tr></thead>

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

function bindView() {
  if (state.tab === "map") {
    const img = document.getElementById("mapImage");
    if (img) {
      if (img.complete && img.naturalWidth) drawMap();
      else img.onload = () => drawMap();
      img.onerror = () => {
        img.removeAttribute("src");
        img.style.display = "none";
        drawMap();
      };
    } else {
      drawMap();
    }
    requestAnimationFrame(() => drawMap());
    ensureMapResizeObserver();
    rebuildMapTransform();
    updateMapCalChrome();

    const canvas = document.getElementById("mapCanvas");
    if (canvas) {
      canvas.onclick = async (e) => {
        const ign = state.mapCalibrateIgn;
        if (!ign) return;
        const rect = state.mapDrawRect;
        if (!rect?.dw) {
          toast("Map image not ready yet", true);
          return;
        }
        const br = canvas.getBoundingClientRect();
        if (!br.width || !br.height) return;
        const px = ((e.clientX - br.left) / br.width) * canvas.width;
        const py = ((e.clientY - br.top) / br.height) * canvas.height;
        const uv = pixelToUv(px, py, rect);
        if (!uv || uv.u < -0.02 || uv.u > 1.02 || uv.v < -0.02 || uv.v > 1.02) {
          toast("Click on the map image (not the black bars)", true);
          return;
        }
        uv.u = Math.min(1, Math.max(0, uv.u));
        uv.v = Math.min(1, Math.max(0, uv.v));

        toast(`Refreshing ${ign} position…`);
        let coords = null;
        try {
          const r = await api("/map/position", { method: "POST", body: { ign } });
          if (r.ok && r.coords) {
            coords = r.coords;
            if (Array.isArray(r.players)) state.playerPositions = r.players;
          }
        } catch {
          /* fall back to cache */
        }
        if (!coords) {
          const p = (state.playerPositions || []).find((x) => x.ign === ign);
          coords = p?.coords || null;
        }
        if (!coords) {
          toast("Lost player coords — wait and try again", true);
          state.mapCalibrateIgn = null;
          updateMapCalChrome();
          return;
        }

        state.mapCal = state.mapCal || { samples: [] };
        state.mapCal.samples = state.mapCal.samples || [];
        // Replace existing mark for same player
        state.mapCal.samples = state.mapCal.samples.filter(
          (s) => String(s.ign).toLowerCase() !== ign.toLowerCase(),
        );
        state.mapCal.samples.push({
          ign,
          wx: coords.x,
          wz: coords.z,
          u: uv.u,
          v: uv.v,
        });
        if (state.mapCal.samples.length > 4) {
          state.mapCal.samples = state.mapCal.samples.slice(-4);
        }
        rebuildMapTransform();
        if (state.mapCal.samples.length >= 2 && !state.mapCal.transform) {
          toast("Marks too close — pick players farther apart on the map", true);
        }
        state.mapCalibrateIgn = null;
        saveMapCal();
        const n = state.mapCal.samples.length;
        toast(
          state.mapCal.transform
            ? `Locked with ${n} marks — dots should stick to the photo`
            : n === 1
              ? "Mark 1 saved — mark one more player in another area"
              : "Marks saved",
        );
        updateMapCalChrome();
        drawMap();
      };
    }

    const pad = document.getElementById("mapCalPad");
    const padVal = document.getElementById("mapCalPadVal");
    if (pad) {
      pad.oninput = () => {
        if (state.mapCal?.transform) {
          toast("Clear click-cal marks to use padding", true);
          pad.value = String(Number(state.mapCal.pad) || 0);
          return;
        }
        state.mapCal = state.mapCal || {};
        state.mapCal.pad = Number(pad.value) || 0;
        if (padVal) padVal.textContent = `${state.mapCal.pad}%`;
        saveMapCal();
        drawMap();
      };
    }
    const sizeIn = document.getElementById("mapCalSize");
    if (sizeIn) {
      sizeIn.onchange = () => {
        if (state.mapCal?.transform) {
          toast("Clear click-cal marks to change world size", true);
          return;
        }
        state.mapCal = state.mapCal || {};

        if (a === "saveWipeAutomation") {
          const enabled = {};
          document.querySelectorAll("[data-wipe-step]").forEach((el) => {
            enabled[el.dataset.wipeStep] = el.checked;
          });
          const autoRunOnSchedule = Boolean(document.getElementById("wipeAutoSchedule")?.checked);
          await api("/wipe/automation", {
            method: "POST",
            body: { enabled, autoRunOnSchedule },
          });
          toast("Wipe automation saved");
          render();
          return;
        }
        if (a === "runWipe") {
          if (!confirm("Run wipe automation now?\n\nThis resets selected bot data (stats, homes, cooldowns, leaderboard). It does NOT wipe the Nitrado map.")) return;
          const enabled = {};
          const steps = [];
          document.querySelectorAll("[data-wipe-step]").forEach((el) => {
            enabled[el.dataset.wipeStep] = el.checked;
            if (el.checked) steps.push(el.dataset.wipeStep);
          });
          if (!steps.length) { toast("Select at least one step", true); return; }
          const autoRunOnSchedule = Boolean(document.getElementById("wipeAutoSchedule")?.checked);
          await api("/wipe/automation", {
            method: "POST",
            body: { enabled, autoRunOnSchedule },
          });
          const wipeLabel = document.getElementById("wipeRunLabel")?.value?.trim() || undefined;
          toast("Running wipe…");
          const r = await api("/wipe/run", { method: "POST", body: { steps, wipeLabel } });
          const fails = (r.results || []).filter((x) => !x.ok).length;
          toast(fails ? `Wipe finished with ${fails} warning(s)` : `Wipe complete — ${r.wipeLabel}`);
          await refreshOverview().catch(() => {});
          render();
          return;
        }
        if (a === "resetStats") {
          if (!confirm("Reset all tracked kill/death stats?")) return;
          await api("/stats/reset", { method: "POST", body: {} }); toast("Stats reset"); render();
        }
        if (a === "lookup") {
          const name = document.getElementById("lookupName").value;
          const r = await api(`/stats/${encodeURIComponent(name)}`);
          document.getElementById("lookupOut").textContent = JSON.stringify(r.player, null, 2);
        }
        if (a === "addWarp") {
          const body = {
            name: document.getElementById("warpName").value,
            fromPlayer: document.getElementById("warpFrom").value || undefined,
            x: document.getElementById("warpX").value || undefined,
            y: document.getElementById("warpY").value || undefined,
            z: document.getElementById("warpZ").value || undefined,
          };
          await api("/warps", { method: "POST", body }); toast("Warp saved"); render();
        }
        if (a === "delWarp") { await api(`/warps/${encodeURIComponent(el.dataset.name)}`, { method: "DELETE" }); toast("Warp deleted"); render(); }
        if (a === "forceTp") {
          const ign = document.getElementById("tpIgn").value;
          const body = {
            toPlayer: document.getElementById("tpTo").value || undefined,
            x: document.getElementById("tpX").value || undefined,
            y: document.getElementById("tpY").value || undefined,
            z: document.getElementById("tpZ").value || undefined,
          };
          await api(`/players/${encodeURIComponent(ign)}/teleport`, { method: "POST", body }); toast("Teleport sent");
        }
        if (a === "forceLink") {
          await api("/links", { method: "POST", body: { discordId: document.getElementById("linkDiscord").value, ign: document.getElementById("linkIgn").value } });
          toast("Linked"); render();
        }
        if (a === "unlink") { await api(`/links/${encodeURIComponent(el.dataset.id)}`, { method: "DELETE" }); toast("Unlinked"); render(); }
        if (a === "addMsg") {
          await api("/automessages", { method: "POST", body: { text: document.getElementById("msgText").value, intervalMinutes: Number(document.getElementById("msgMins").value) } });
          toast("Message added"); render();
        }
        if (a === "toggleMsg") { await api(`/automessages/${el.dataset.id}/toggle`, { method: "POST", body: { enabled: el.dataset.on === "1" } }); render(); }
        if (a === "delMsg") { await api(`/automessages/${el.dataset.id}`, { method: "DELETE" }); render(); }
        if (a === "addJob") {
          await api("/schedule", { method: "POST", body: {
            name: document.getElementById("jobName").value,
            command: document.getElementById("jobCmd").value,
            intervalMinutes: Number(document.getElementById("jobMins").value),
          }});
          toast("Job scheduled"); render();
        }
        if (a === "runJob") { const r = await api(`/schedule/${el.dataset.id}/run`, { method: "POST", body: {} }); toast(r.result || "Ran"); render(); }
        if (a === "toggleJob") { await api(`/schedule/${el.dataset.id}/toggle`, { method: "POST", body: { enabled: el.dataset.on === "1" } }); render(); }
        if (a === "delJob") { await api(`/schedule/${el.dataset.id}`, { method: "DELETE" }); render(); }
        if (a === "createKey") {
          const permissions = {};
          document.querySelectorAll("[data-perm-check]").forEach((box) => {
            permissions[box.dataset.permCheck] = box.checked;
          });
          const r = await api("/keys", {
            method: "POST",
            body: { label: document.getElementById("keyLabel").value, permissions },
          });
          state.lastCreatedKey = r;
          toast("Staff key created — copy it now");
          render();
        }
        if (a === "toggleKey") {
          await api(`/keys/${el.dataset.id}`, { method: "PATCH", body: { enabled: el.dataset.on === "1" } });
          toast(el.dataset.on === "1" ? "Key enabled" : "Key disabled");
          render();
        }
        if (a === "revokeKey") {
          if (!confirm("Permanently revoke this access key?")) return;
          await api(`/keys/${el.dataset.id}`, { method: "DELETE" });
          toast("Key revoked");
          render();
        }
        
        // Ban Management
        if (a === "syncBans") {
          const r = await api("/bans/sync", { method: "POST", body: {} });
          if (r.ok) {
            if (r.sync?.ok === false) {
              toast(r.sync.error || "Sync failed — check RCON");
            } else {
              const added = (r.sync?.added || 0) + (r.fromLogs?.added || 0);
              const parsed = r.sync?.parsed || 0;
              toast(
                added
                  ? `Synced ${added} new ban(s) (${parsed} on server)`
                  : parsed
                    ? `Server list matched (${parsed} bans)`
                    : "No bans found in server response",
              );
            }
            render();
          } else {
            toast(r.error || "Sync failed");
          }
          return;
        }
        if (a === "createBan") {
          const ign = document.getElementById("banIgn")?.value?.trim();
          const reason = document.getElementById("banReason")?.value?.trim();
          const duration = Number(document.getElementById("banDuration")?.value || 0);
          
          if (!ign) { toast("Player IGN required", true); return; }
          if (!reason) { toast("Ban reason required", true); return; }
          
          const r = await api("/bans", { method: "POST", body: { ign, reason, duration } });
          if (r.ok) {
            toast(`Banned ${ign}`);
            render();
          } else {
            toast(r.error, true);
          }
        }
        
        if (a === "unban") {
          const ign = el.dataset.ign;
          if (!confirm(`Unban ${ign}?`)) return;
          
          const r = await api(`/bans/${encodeURIComponent(ign)}`, { method: "DELETE", body: {} });
          if (r.ok) {
            toast(`Unbanned ${ign}`);
            render();
          } else {
            toast(r.error, true);
          }
        }
        
        // Scheduled Events
        if (a === "createEvent") {
          const name = document.getElementById("eventName")?.value?.trim();
          const command = document.getElementById("eventCommand")?.value?.trim();
          const type = document.getElementById("eventType")?.value;
          
          if (!name) { toast("Event name required", true); return; }
          if (!command) { toast("Command required", true); return; }
          
          let schedule = { type };
          
          if (type === "interval") {
            schedule.minutes = Number(document.getElementById("eventInterval")?.value || 60);
          } else if (type === "daily") {
            schedule.time = document.getElementById("eventTime")?.value || "04:00";
          } else if (type === "once") {
            schedule.at = document.getElementById("eventOnce")?.value;
            if (!schedule.at) { toast("Date/time required for one-time events", true); return; }
          }
          
          const r = await api("/events", { method: "POST", body: { name, command, schedule, oneTime: type === "once" } });
          if (r.ok) {
            toast("Event created");
            render();
          } else {
            toast(r.error, true);
          }
        }
        
        if (a === "runScheduledEvent") {
          const r = await api(`/events/${el.dataset.id}/run`, { method: "POST", body: {} });
          if (r.ok) {
            toast("Event executed");
          } else {
            toast(r.error, true);
          }
          return;
        }
        
        if (a === "toggleEvent") {
          const enabled = el.dataset.enabled === "1" ? false : true;
          const r = await api(`/events/${el.dataset.id}`, { method: "PATCH", body: { enabled } });
          if (r.ok) {
            toast(enabled ? "Event enabled" : "Event disabled");
            render();
          } else {
            toast(r.error, true);
          }
        }
        
        if (a === "delEvent") {
          if (!confirm("Delete this scheduled event?")) return;
          const r = await api(`/events/${el.dataset.id}`, { method: "DELETE" });
          if (r.ok) {
            toast("Event deleted");
            render();
          } else {
            toast(r.error, true);
          }
        }
      } catch (e) {
        toast(e.message, true);
      }
    };
  });

  // Event type selector
  const eventTypeSelector = document.getElementById("eventType");
  if (eventTypeSelector) {
    eventTypeSelector.onchange = () => {
      const type = eventTypeSelector.value;
      document.getElementById("intervalField")?.classList.toggle("hidden", type !== "interval");
      document.getElementById("timeField")?.classList.toggle("hidden", type !== "daily");
      document.getElementById("onceField")?.classList.toggle("hidden", type !== "once");
    };
  }

  document.querySelectorAll("[data-toggle-dropdown]").forEach((btn) => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const target = btn.dataset.toggleDropdown;
      const dropdown = btn.closest(".dropdown");
      const wasOpen = dropdown.classList.contains("open");
      
      document.querySelectorAll(".dropdown.open").forEach(d => d.classList.remove("open"));
      
      if (!wasOpen) {
        dropdown.classList.add("open");
      }
    };
  });

  document.addEventListener("click", () => {
    document.querySelectorAll(".dropdown.open").forEach(d => d.classList.remove("open"));
  });

  const rconInput = document.getElementById("rconCmd");
  if (rconInput) {
    rconInput.onkeydown = (e) => {
      if (e.key === "Enter") document.querySelector('[data-action="rcon"]')?.click();
    };
  }

  const playerHubSearch = document.getElementById("playerHubSearch");
  if (playerHubSearch) {
    playerHubSearch.onkeydown = (e) => {
      if (e.key === "Enter") document.querySelector('[data-action="searchPlayersHub"]')?.click();
    };
  }

  document.querySelectorAll("[data-channel-key]").forEach((sel) => {
    sel.onchange = () => {
      const input = document.querySelector(`[data-channel-manual="${sel.dataset.channelKey}"]`);
      if (input) input.value = sel.value;
    };
  });
  document.querySelectorAll("[data-channel-manual]").forEach((input) => {
    input.oninput = () => {
      const sel = document.querySelector(`[data-channel-key="${input.dataset.channelManual}"]`);
      if (!sel) return;
      const match = [...sel.options].find((o) => o.value === input.value.trim());
      sel.value = match ? match.value : "";
    };
  });
  document.querySelectorAll("[data-kit-modal]").forEach((modal) => {
    modal.onclick = (e) => e.stopPropagation();
  });
  bindKitBuilderEvents();
}

document.getElementById("loginBtn").onclick = async () => {
  try {
    await api("/login", { method: "POST", body: { password: document.getElementById("password").value } });
    const errorEl = document.getElementById("loginError");
    errorEl.textContent = "";
    errorEl.classList.add("hidden");
    await boot();
  } catch (e) {
    const errorEl = document.getElementById("loginError");
    errorEl.textContent = e.message || "Invalid password";
    errorEl.classList.remove("hidden");
  }
};
document.getElementById("password").onkeydown = (e) => {
  if (e.key === "Enter") document.getElementById("loginBtn").click();
};
document.getElementById("logoutBtn").onclick = async () => {
  await api("/logout", { method: "POST", body: {} });
  location.reload();
};
document.querySelectorAll(".nav [data-tab]").forEach((b) => {
  b.onclick = () => setTab(b.dataset.tab);
});
document.querySelectorAll(".nav [data-nav]").forEach((b) => {
  b.onclick = () => {
    const tab = defaultTabForSection(b.dataset.nav);
    if (tab) setTab(tab);
  };
});
document.getElementById("advancedToggle")?.addEventListener("click", () => {
  const root = document.getElementById("navAdvanced");
  setAdvancedOpen(!root?.classList.contains("open"));
});

document.getElementById("navToggle")?.addEventListener("click", () => setNavOpen(true));
document.getElementById("navClose")?.addEventListener("click", () => setNavOpen(false));
document.getElementById("navBackdrop")?.addEventListener("click", () => setNavOpen(false));
document.getElementById("logoutBtnMobile")?.addEventListener("click", () => document.getElementById("logoutBtn")?.click());
window.addEventListener("keydown", (e) => { if (e.key === "Escape") setNavOpen(false); });

// Mobile swipe gestures for sidebar
let touchStartX = 0;
let touchStartY = 0;
let touchEndX = 0;
let touchEndY = 0;

function handleSwipe() {
  const deltaX = touchEndX - touchStartX;
  const deltaY = Math.abs(touchEndY - touchStartY);
  
  if (Math.abs(deltaX) > 50 && deltaY < 70) {
    if (deltaX > 0 && touchStartX < 50) {
      setNavOpen(true);
    } else if (deltaX < 0 && state.navOpen) {
      setNavOpen(false);
    }
  }
}

document.addEventListener("touchstart", (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

document.addEventListener("touchend", (e) => {
  touchEndX = e.changedTouches[0].screenX;
  touchEndY = e.changedTouches[0].screenY;
  handleSwipe();
}, { passive: true });


boot().catch((e) => {
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginError").textContent = e.message;
  initLoginScene();
});
</script>
</body>
